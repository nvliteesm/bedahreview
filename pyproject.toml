[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bedahreview"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["google-genai>=1.0", "apify-client>=1.12", "jsonschema>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bedahreview = ["static/*", "static/icons/*"]
