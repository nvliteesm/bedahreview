<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f6b5a">
<title>BedahReview</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* Phone first: one column up to 480px wide, 16px gutters, 44px touch targets, safe-area padding.
   Three tabs: Perbaiki (Fix it), Tanggapi (Fight it), Abaikan (Ignore). Light and dark follow the system. */
:root {
  --bg: #f6f7f5; --surface: #ffffff; --ink: #17201c; --muted: #5d6963; --line: #dde2de; --quote: #f3f5f2;
  --accent: #0f6b5a; --on-accent: #ffffff; --accent-soft: #dff1ec;
  --fix: #b25a00; --fix-soft: #fff1e0; --fight: #b3263e; --fight-soft: #fde8ec;
  --ignore: #69726e; --ignore-soft: #eef0ef; --check: #4338ca; --keep: #166534; --keep-soft: #def5e4;
  --font-ui: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --gutter: 16px; --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111614; --surface: #1a211e; --ink: #e8eeea; --muted: #9aa8a1; --line: #2c3632; --quote: #222a26;
    --accent: #4fc2a8; --on-accent: #0b1411; --accent-soft: #163a33;
    --fix: #f0a24a; --fix-soft: #33261a; --fight: #f27088; --fight-soft: #351c22;
    --ignore: #a3aca8; --ignore-soft: #242b28; --check: #a5b4fc; --keep: #86efac; --keep-soft: #12281a;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-ui); }
h1, h2, h3, p, ol, ul { margin: 0; }
h2 { font-size: 1.1rem; line-height: 1.3; font-weight: 800; }
h3 { font-size: 1rem; line-height: 1.3; font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h2[tabindex="-1"]:focus, .error:focus { outline: none; }

/* ---------- frame ---------- */
.topbar { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: env(safe-area-inset-top) max(var(--gutter), env(safe-area-inset-right)) 0 max(var(--gutter), env(safe-area-inset-left)); }
.topbar-in { max-width: 480px; margin: 0 auto; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em; }
.brand span { color: var(--accent); }
.lang { min-height: 44px; min-width: 64px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
.lang b { color: var(--accent); }
main { max-width: 480px; margin: 0 auto; display: grid; gap: 14px; align-content: start;
  padding: 16px max(var(--gutter), env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(var(--gutter), env(safe-area-inset-left)); }
.bottombar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.bottombar-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; }
.nav { min-height: 56px; display: grid; place-items: center; align-content: center; gap: 2px; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
.nav[aria-current="page"] { color: var(--accent); }
.nav[disabled] { opacity: 0.4; cursor: default; }

/* ---------- controls ---------- */
.card-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 12px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--ignore-soft); border-radius: 12px; }
.seg button { min-height: 44px; padding: 0 8px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-weight: 700; font-size: 0.92rem; cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
label.field, .fld { display: grid; gap: 4px; font-size: 0.82rem; font-weight: 700; color: var(--muted); }
textarea, input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; width: 100%; }
textarea { min-height: 190px; resize: vertical; font: 0.9rem/1.6 var(--font-mono); padding: 12px; }
input, select { min-height: 44px; padding: 0 12px; font-size: 1rem; /* 16px stops iOS zooming into the field */ }
textarea::placeholder, input::placeholder { color: var(--muted); opacity: 0.8; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid transparent; font: inherit; font-weight: 700; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--on-accent); width: 100%; }
.btn.ghost { background: var(--surface); color: var(--accent); border-color: var(--line); min-height: 44px; font-size: 0.9rem; }
.btn[disabled] { opacity: 0.55; cursor: progress; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn.ghost { flex: 1 1 auto; }
details summary { cursor: pointer; font-weight: 600; color: var(--accent); min-height: 44px; display: flex; align-items: center; }
details pre { margin: 0 0 4px; padding: 12px; background: var(--quote); border-radius: 10px; font: 0.8rem/1.6 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.steps-list { padding-left: 1.3em; display: grid; gap: 6px; font-size: 0.92rem; }
.callout { border-radius: 10px; padding: 10px 12px; font-size: 0.88rem; font-weight: 600; background: var(--accent-soft); color: var(--ink); border: 1px solid var(--line); }
.callout.warn { background: var(--fix-soft); color: var(--fix); border-color: currentColor; }
.callout.hot { background: var(--fight-soft); color: var(--fight); border-color: currentColor; }
.error { display: flex; gap: 10px; align-items: flex-start; background: var(--fight-soft); color: var(--fight); border: 1px solid currentColor; border-radius: 10px; padding: 10px 12px; font-weight: 600; }
.error svg { margin-top: 3px; }
.chip { display: inline-flex; align-items: center; font-size: 0.75rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.fix { color: var(--fix); background: var(--fix-soft); border-color: currentColor; }
.chip.hot { color: var(--fight); background: var(--fight-soft); border-color: currentColor; }
.chip.soft { background: var(--ignore-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- loading ---------- */
.loading { text-align: center; padding: 48px 8px; display: grid; gap: 10px; justify-items: center; }
.spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- results ---------- */
.res-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { border-radius: 12px; padding: 10px 6px; text-align: center; background: var(--surface); border: 1px solid var(--line); }
.tile .n { display: block; font-size: 1.6rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 0.78rem; font-weight: 700; color: var(--muted); }
.tile[data-b="fix"] .n { color: var(--fix); } .tile[data-b="fight"] .n { color: var(--fight); } .tile[data-b="ignore"] .n { color: var(--ignore); }
.tabs { position: sticky; top: calc(57px + env(safe-area-inset-top)); z-index: 5; background: var(--bg); padding: 4px 0; }
.tabs .seg button[aria-selected="true"][data-b="fix"] { color: var(--fix); background: var(--fix-soft); }
.tabs .seg button[aria-selected="true"][data-b="fight"] { color: var(--fight); background: var(--fight-soft); }
.tabs .seg button[aria-selected="true"][data-b="ignore"] { color: var(--ignore); background: var(--ignore-soft); }
.panel { display: grid; gap: 12px; }
.rule { font-size: 0.9rem; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.panel[data-b="fix"] { --c: var(--fix); } .panel[data-b="fight"] { --c: var(--fight); } .panel[data-b="ignore"] { --c: var(--ignore); } .strip { --c: var(--keep); }
.stars { color: var(--fix); letter-spacing: 1px; white-space: nowrap; }
blockquote { margin: 0; padding: 8px 12px; border-left: 4px solid var(--c); background: var(--quote); border-radius: 0 8px 8px 0; display: grid; gap: 2px; overflow-wrap: anywhere; font-size: 0.95rem; }
blockquote .src { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.full summary { font-size: 0.85rem; min-height: 44px; }
.full p { font-size: 0.88rem; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.why { font-size: 0.92rem; color: var(--muted); }
.draft { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); overflow: hidden; }
.draft-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px 2px 12px; background: var(--ignore-soft); }
.draft-head .lbl { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
.copy { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: var(--accent); font: inherit; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
.copy.done { color: var(--keep); }
.draft .bahasa { padding: 12px; font-size: 0.95rem; overflow-wrap: anywhere; white-space: pre-wrap; user-select: text; -webkit-user-select: text; }
.empty { border: 2px dashed var(--line); border-radius: var(--radius); padding: 20px; color: var(--muted); text-align: center; }
.ignore-list { display: grid; gap: 8px; list-style: none; padding: 0; }
.ignore-list li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 0.92rem; overflow-wrap: anywhere; }
.strip { background: var(--keep-soft); border-radius: var(--radius); padding: 12px; display: grid; gap: 8px; }
.strip h3 { color: var(--keep); }
.foot { font-size: 0.8rem; color: var(--muted); }

@media (pointer: fine) and (min-width: 481px) { main { padding-top: 24px; } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } * { transition-duration: 0.01ms !important; } }
@media print {
  :root { --bg: #fff; --surface: #fff; --ink: #000; --muted: #333; --line: #bbb; }
  .topbar, .bottombar, #view-input, .tabs, .tiles, .copy, #print { display: none !important; }
  .panel[hidden] { display: grid !important; }
  .card, .draft { break-inside: avoid; }
  main { max-width: none; padding-bottom: 0; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">Bedah<span>Review</span></div>
    <button class="lang" id="lang" type="button" aria-label="Bahasa / Language"></button>
  </div>
</header>

<main id="main">

  <!-- input -->
  <section id="view-input" aria-label="Ulasan baru" data-i18n-label="newReviews">
    <div class="card-box">
      <div class="seg" role="tablist" id="intabs">
        <button role="tab" id="intab-paste" aria-controls="in-paste" aria-selected="true" type="button" data-t="paste" data-i18n="tabPaste"></button>
        <button role="tab" id="intab-share" aria-controls="in-share" aria-selected="false" tabindex="-1" type="button" data-t="share" data-i18n="tabShare"></button>
        <button role="tab" id="intab-link" aria-controls="in-link" aria-selected="false" tabindex="-1" type="button" data-t="link" hidden><span data-i18n="tabLink"></span> <span class="chip fix">Demo</span></button>
      </div>

      <div id="in-paste" role="tabpanel" aria-labelledby="intab-paste" style="display:grid;gap:12px">
        <p class="muted" data-i18n="pasteHint"></p>
        <div class="callout" id="shared-note" hidden></div>
        <label class="field" for="product"><span data-i18n="productLabel"></span>
          <input id="product" type="text" maxlength="150" autocomplete="off" data-i18n-ph="productPh">
        </label>
        <label class="field" for="paste"><span data-i18n="reviewsLabel"></span>
          <textarea id="paste" spellcheck="false" placeholder="★★★☆☆  Putih, M   warna tulisannya ijo, pas dateng hitem&#10;★★☆☆☆  Hitam, L   Pas sampe koyak bajunya"></textarea>
        </label>
        <details>
          <summary data-i18n="howSummary"></summary>
          <pre data-i18n="howBody"></pre>
        </details>
        <button class="btn primary" id="run" type="button" data-i18n="run"></button>
        <div class="row">
          <button class="btn ghost" id="sample" type="button" data-i18n="sample"></button>
          <button class="btn ghost" id="clear" type="button" data-i18n="clear"></button>
        </div>
      </div>

      <div id="in-share" role="tabpanel" aria-labelledby="intab-share" style="display:grid;gap:12px" hidden>
        <p class="muted" data-i18n="shareHint"></p>
        <ol class="steps-list" id="share-steps"></ol>
        <div class="callout warn" data-i18n="shareCaveat"></div>
        <p class="small muted" data-i18n="iosNote"></p>
        <button class="btn ghost" id="install" type="button" hidden data-i18n="install"></button>
      </div>

      <div id="in-link" role="tabpanel" aria-labelledby="intab-link" style="display:grid;gap:12px" hidden>
        <div class="callout warn" data-i18n="linkDemo"></div>
        <label class="field" for="url"><span data-i18n="linkLabel"></span>
          <input id="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://shopee.co.id/...-i.12345.67890">
        </label>
        <div class="row">
          <label class="fld" for="mode" style="flex:1 1 150px"><span data-i18n="modeLabel"></span>
            <select id="mode"><option value="complaints" data-i18n="modeComplaints"></option><option value="latest" data-i18n="modeLatest"></option></select>
          </label>
          <label class="fld" for="limit" style="flex:0 0 96px"><span data-i18n="limitLabel"></span>
            <input id="limit" type="number" min="1" max="20" value="10" inputmode="numeric">
          </label>
        </div>
        <button class="btn primary" id="fetch" type="button" data-i18n="fetchRun"></button>
        <p class="small muted" data-i18n="linkNote"></p>
      </div>

      <div class="error" id="error" role="alert" tabindex="-1" hidden>
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <span id="error-text"></span>
      </div>
    </div>
  </section>

  <!-- loading -->
  <section id="view-loading" class="loading" hidden aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <h2 id="loading-title"></h2>
    <p class="muted" id="loading-sub"></p>
    <p class="small muted" id="elapsed" aria-hidden="true"></p>
  </section>

  <!-- results -->
  <section id="view-results" hidden aria-labelledby="results-h" style="display:grid;gap:12px">
    <div class="res-head">
      <div>
        <h2 id="results-h" tabindex="-1"></h2>
        <p class="small muted" id="summary"></p>
      </div>
      <button class="btn ghost" id="print" type="button" data-i18n="print"></button>
    </div>
    <div class="tiles" id="tiles"></div>
    <div id="notes" style="display:grid;gap:8px"></div>
    <div class="tabs"><div class="seg" id="tabs" role="tablist"></div></div>
    <div id="panels"></div>
    <div id="keep"></div>
    <p class="foot" id="foot"></p>
  </section>

  <span class="vh" id="toast" role="status" aria-live="polite"></span>
</main>

<nav class="bottombar" aria-label="Menu">
  <div class="bottombar-in">
    <button class="nav" id="nav-results" type="button" disabled><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg><span data-i18n="navCheck"></span></button>
    <button class="nav" id="nav-input" type="button" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="navNew"></span></button>
  </div>
</nav>

<script>

const THEME_ID = {
  "Not as described / claim vs reality": "Tidak sesuai deskripsi", "Colour vs photo": "Warna beda dari foto", "Sizing & fit": "Ukuran & ukuran pas",
  "Fabric & material quality": "Bahan & kualitas", "Defect / not working": "Cacat / tidak berfungsi", "Wrong variant / item sent": "Varian / barang salah",
  "Quantity shortage / missing item": "Jumlah kurang / barang hilang", "Packaging / damaged on arrival": "Kemasan / rusak saat tiba",
  "Spoilage / freshness": "Basi / kesegaran", "Portion / low meat or filler": "Porsi / isi kurang", "Taste / subjective": "Rasa / selera",
  "Fake / authenticity doubt": "Diragukan keasliannya", "Praise: quality / material": "Pujian: kualitas / bahan", "Praise: value for money": "Pujian: sepadan harga",
  "Praise: seller service": "Pujian: layanan toko", "Praise: delivery / packing": "Pujian: pengiriman / kemasan", "Praise: taste": "Pujian: rasa",
  "Praise: works as described": "Pujian: sesuai deskripsi", "No text": "Tanpa teks", "Other": "Lainnya",
};

const $ = (id) => document.getElementById(id);
let lang = "id";
try { if (localStorage.getItem("bedahreview-lang") === "en") lang = "en"; } catch (e) { /* storage can be blocked */ }
const tr = (key, ...args) => { let s = (TEXT[lang][key] != null ? TEXT[lang][key] : TEXT.id[key]); args.forEach((a) => { s = s.replace("%s", a); }); return s; };
const themeName = (t) => (lang === "id" && THEME_ID[t]) || t;
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// Build DOM without innerHTML: review text and model output are never parsed as HTML.
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const NS = "http://www.w3.org/2000/svg";
function copyIcon() {
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", "i"); svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("aria-hidden", "true");
  const r = document.createElementNS(NS, "rect"); [["x", 8], ["y", 8], ["width", 14], ["height", 14], ["rx", 2]].forEach(([k, v]) => r.setAttribute(k, v));
  const p = document.createElementNS(NS, "path"); p.setAttribute("d", "M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2");
  svg.append(r, p); return svg;
}
const starsText = (n) => (n ? "★".repeat(n) + "☆".repeat(5 - n) : "");
function announce(msg) { const t = $("toast"); t.textContent = ""; setTimeout(() => { t.textContent = msg; }, 30); }

/* ---------- static text for the current language ---------- */
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = tr(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = tr(el.dataset.i18nPh); });
  document.querySelectorAll("[data-i18n-label]").forEach((el) => { el.setAttribute("aria-label", tr(el.dataset.i18nLabel)); });
  $("share-steps").replaceChildren(...TEXT[lang].shareSteps.map((s) => h("li", { text: s })));
  $("lang").replaceChildren(h("b", { text: lang === "id" ? "ID" : "EN" }), " | ", lang === "id" ? "EN" : "ID");
  if (!$("run").disabled) $("run").textContent = tr("run");
  if (lastData) render(lastData, false);
}
$("lang").addEventListener("click", () => {
  lang = lang === "id" ? "en" : "id";
  try { localStorage.setItem("bedahreview-lang", lang); } catch (e) { /* ignore */ }
  applyLang();
});

/* ---------- copy with a selection fallback ---------- */
function selectNode(node) {
  const range = document.createRange(); range.selectNodeContents(node);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
}
async function copyText(text, btn, label, textNode) {
  const reset = () => setTimeout(() => { btn.classList.remove("done"); btn.replaceChildren(copyIcon(), tr("copy")); }, 1500);
  try { await navigator.clipboard.writeText(text); btn.classList.add("done"); btn.replaceChildren(tr("copied")); announce(tr("copiedAnn", label)); reset(); return; } catch (e) { /* fall through */ }
  selectNode(textNode);  // clipboard blocked: leave the text selected so the long-press Copy works
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  btn.classList.add("done"); btn.replaceChildren(ok ? tr("copied") : tr("selectIt")); announce(ok ? tr("copiedAnn", label) : tr("selectIt")); reset();
}
function draft(label, text) {
  if (!text) return null;
  const body = h("p", { class: "bahasa", lang: "id", text });
  const btn = h("button", { class: "copy", type: "button", "aria-label": tr("copy") + ": " + label }, copyIcon(), tr("copy"));
  btn.addEventListener("click", () => copyText(text, btn, label, body));
  return h("div", { class: "draft" }, h("div", { class: "draft-head" }, h("span", { class: "lbl", text: label }), btn), body);
}

/* ---------- cards ---------- */
function quote(item) {
  const src = ["#" + item.id, item.variant].filter(Boolean).join(" · ");
  return h("blockquote", {},
    h("span", { lang: "id" }, item.stars ? h("span", { class: "stars", "aria-label": tr("stars", item.stars), text: starsText(item.stars) + " " }) : null, item.proof_quote ? "“" + item.proof_quote + "”" : tr("noText")),
    h("span", { class: "src", text: src }));
}
function fullText(item) {
  if (!item.text || item.text === item.proof_quote) return null;
  return h("details", { class: "full" }, h("summary", { text: tr("fullReview") }), h("p", { lang: "id", text: item.text }));
}
function replyCard(item) {
  const kit = item.fight || {};
  const fake = item.likely_fake && item.likely_fake.flag;
  return h("article", { class: "card" },
    h("div", { class: "chips" },
      fake ? h("span", { class: "chip hot", text: tr("chipFake") }) : null,
      item.bucket === "check" ? h("span", { class: "chip soft", text: tr("chipCheck") }) : null,
      item.check_first ? h("span", { class: "chip hot", text: tr("chipCourier") }) : null,
      item.variant ? h("span", { class: "chip soft", text: item.variant }) : null,
      item.confidence === "low" ? h("span", { class: "chip", text: tr("chipLow") }) : null),
    h("h3", { text: themeName(item.theme) }),
    quote(item), fullText(item),
    kit.why ? h("p", { class: "why", text: kit.why }) : null,
    kit.steps && kit.steps.length ? h("ol", { class: "steps-list" }, kit.steps.map((s) => h("li", { text: s }))) : null,
    item.bucket === "check" ? draft(tr("dCheckSide"), item.fix_suggestion_id) : null,
    draft(tr("dChat"), kit.chat_to_buyer), draft(tr("dPublic"), kit.public_reply), draft(tr("dReport"), kit.report_text));
}
function fixCard(group, byId) {
  const members = group.ids.map((id) => byId[id]);
  const suggestions = [...new Set(members.map((m) => m.fix_suggestion_id).filter(Boolean))];
  return h("article", { class: "card" },
    h("div", { class: "chips" },
      h("span", { class: "chip fix", text: tr("chipOf", group.n, group.of) }),
      group.variant ? h("span", { class: "chip soft", text: group.variant }) : null),
    h("h3", { text: themeName(group.theme) }),
    members.map((m) => [quote(m), fullText(m)]),
    suggestions.map((s) => draft(tr("dFix"), s)));
}
function ignoreList(items) {
  return h("ul", { class: "ignore-list" }, items.map((it) => h("li", { lang: "id", text: "#" + it.id + (it.stars ? " · " + starsText(it.stars) : "") + " · " + (it.text || tr("noText")) })));
}

/* ---------- results ---------- */
const TABS = ["fix", "fight", "ignore"];
let lastData = null, activeTab = "fix";
function selectTab(key, focus) {
  activeTab = key;
  for (const k of TABS) {
    const on = k === key;
    $("tab-" + k).setAttribute("aria-selected", on ? "true" : "false"); $("tab-" + k).tabIndex = on ? 0 : -1;
    $("panel-" + k).hidden = !on;
    if (on && focus) $("tab-" + k).focus();
  }
}
function render(data, fresh) {
  lastData = data;
  const byId = {}; data.items.forEach((it) => { byId[it.id] = it; });
  const real = data.items.filter((it) => !(it.likely_fake && it.likely_fake.flag));
  const fixItems = data.groups;
  const fight = data.items.filter((it) => it.bucket === "fight" || it.bucket === "check")
    .sort((a, b) => (a.likely_fake.flag - b.likely_fake.flag) || (a.bucket === b.bucket ? 0 : a.bucket === "fight" ? -1 : 1));
  const ignore = data.items.filter((it) => it.bucket === "ignore");
  const keep = real.filter((it) => it.bucket === "keep");
  const counts = { fix: data.counts.fix, fight: data.counts.fight + data.counts.check, ignore: data.counts.ignore };

  const src = data.source || {};
  const name = src.title ? src.title + " · " : "";
  $("results-h").textContent = tr("results");
  $("summary").textContent = name + data.reviews + " " + tr("reviewsWord") + (data.star_avg ? " · " + data.star_avg + "★" : "");
  $("tiles").replaceChildren(...TABS.map((k) => h("div", { class: "tile", "data-b": k }, h("span", { class: "n", text: counts[k] }), h("span", { class: "l", text: tr(k) }))));

  const notes = [];
  if (data.likely_fake) notes.push(h("div", { class: "callout hot", text: tr("noteFake", data.likely_fake) }));
  if (data.no_text) notes.push(h("div", { class: "callout", text: tr("noteNoText", data.no_text) }));
  if (data.dropped) notes.push(h("div", { class: "callout warn", text: tr("noteDropped", data.dropped) }));
  $("notes").replaceChildren(...notes);

  $("tabs").replaceChildren(...TABS.map((k) => {
    const tab = h("button", { type: "button", role: "tab", id: "tab-" + k, "aria-controls": "panel-" + k, "data-b": k, text: tr(k) + " " + counts[k] });
    tab.addEventListener("click", () => selectTab(k, false));
    return tab;
  }));
  const panel = (k, body) => h("div", { class: "panel", role: "tabpanel", id: "panel-" + k, "aria-labelledby": "tab-" + k, "data-b": k, hidden: true }, h("p", { class: "rule", text: tr(k + "Rule") }), body);
  $("panels").replaceChildren(
    panel("fix", fixItems.length ? fixItems.map((g) => fixCard(g, byId)) : h("div", { class: "empty", text: tr("emptyFix") })),
    panel("fight", fight.length ? fight.map(replyCard) : h("div", { class: "empty", text: tr("emptyFight") })),
    panel("ignore", ignore.length ? ignoreList(ignore) : h("div", { class: "empty", text: tr("emptyIgnore") })));

  const themes = [...new Set(keep.map((k) => k.theme.replace(/^Praise: /, "")))];
  $("keep").replaceChildren(...(keep.length ? [h("div", { class: "strip" },
    h("h3", { text: tr("keepTitle") }), h("p", { class: "small muted", text: tr("keepSub") }),
    h("div", { class: "chips" }, themes.map((t) => h("span", { class: "chip soft", text: themeName("Praise: " + t).replace(/^Pujian: |^Praise: /, "") }))),
    keep.slice(0, 3).map(quote))] : []));

  const fromLink = src.kind === "url" ? tr("footFrom", src.count, src.mode === "complaints" ? tr("footLow") : "", src.cached ? tr("footCached") : "") : "";
  $("foot").textContent = fromLink + tr("footTail", data.model);

  const first = fresh === false ? activeTab : (counts.fix ? "fix" : counts.fight ? "fight" : counts.ignore ? "ignore" : "fix");
  selectTab(first, false);
  if (fresh !== false) {
    $("nav-results").disabled = false;
    show("results");
    $("results-h").focus({ preventScroll: true });
    window.scrollTo({ top: 0, behavior: reduceMotion() ? "auto" : "smooth" });
  }
}

/* ---------- views ---------- */
function show(view) {
  $("view-input").hidden = view !== "input";
  $("view-loading").hidden = view !== "loading";
  $("view-results").hidden = view !== "results";
  $("nav-input").setAttribute("aria-current", view === "input" || view === "loading" ? "page" : "false");
  $("nav-results").setAttribute("aria-current", view === "results" ? "page" : "false");
}
$("nav-input").addEventListener("click", () => { show("input"); window.scrollTo(0, 0); });
$("nav-results").addEventListener("click", () => { if (lastData) { show("results"); window.scrollTo(0, 0); } });

function tabKeys(listEl, selector, onSelect) {
  listEl.addEventListener("keydown", (e) => {
    const tabs = [...listEl.querySelectorAll(selector)].filter((t) => !t.hidden);
    const i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    let j = null;
    if (e.key === "ArrowRight") j = (i + 1) % tabs.length; else if (e.key === "ArrowLeft") j = (i - 1 + tabs.length) % tabs.length;
    else if (e.key === "Home") j = 0; else if (e.key === "End") j = tabs.length - 1;
    if (j == null) return;
    e.preventDefault(); onSelect(tabs[j]);
  });
}
tabKeys($("tabs"), "button", (t) => selectTab(t.dataset.b, true));

function selectInput(which, focus) {
  for (const t of ["paste", "share", "link"]) {
    const on = t === which;
    $("intab-" + t).setAttribute("aria-selected", on ? "true" : "false"); $("intab-" + t).tabIndex = on ? 0 : -1;
    $("in-" + t).hidden = !on;
    if (on && focus) $("intab-" + t).focus();
  }
  showError("");
}
document.querySelectorAll("#intabs button").forEach((b) => b.addEventListener("click", () => selectInput(b.dataset.t, false)));
tabKeys($("intabs"), "button", (t) => selectInput(t.dataset.t, true));

function showError(msg) {
  const e = $("error");
  $("error-text").textContent = msg; e.hidden = !msg;
  if (msg) e.focus();
}

/* ---------- sending ---------- */
let timer = null;
function startLoading(title) {
  const t0 = Date.now();
  $("loading-title").textContent = title; $("loading-sub").textContent = tr("loadingSub"); $("elapsed").textContent = "0s";
  show("loading");
  timer = setInterval(() => { $("elapsed").textContent = Math.round((Date.now() - t0) / 1000) + "s"; }, 1000);
}
function stopLoading() { clearInterval(timer); timer = null; }

async function send(payload, title) {
  showError("");
  const buttons = [$("run"), $("fetch")]; buttons.forEach((b) => { b.disabled = true; });
  startLoading(title);
  try {
    const res = await fetch("/api/classify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    let data = null;
    try { data = await res.json(); } catch (e) { /* not JSON */ }
    stopLoading();
    if (!res.ok || !data) {
      show("input");
      if (data && data.fallback === "paste") selectInput("paste", false);  // first: switching tabs clears the error box
      showError((data && data.error) || tr("errGeneric", res.status));
      return;
    }
    render(data, true);
  } catch (e) {
    stopLoading(); show("input"); showError(tr("errNetwork"));
  } finally {
    buttons.forEach((b) => { b.disabled = false; });
    $("run").textContent = tr("run");
  }
}
function countReviewsRough(text) {
  const blocks = /\n\s*\n/.test(text.trim()) ? text.trim().split(/\n\s*\n/) : text.trim().split("\n");
  return blocks.filter((b) => b.trim()).length;
}
function runPaste() {
  const text = $("paste").value;
  if (!text.trim()) { showError(tr("errPaste")); $("paste").focus(); return; }
  $("shared-note").hidden = true;
  send({ text, product: $("product").value.trim() }, tr("loadingTitle", countReviewsRough(text)));
}
function runFetch() {
  const url = $("url").value.trim();
  if (!url) { showError(tr("errLink")); $("url").focus(); return; }
  send({ url, limit: parseInt($("limit").value, 10) || 10, mode: $("mode").value }, tr("loadingFetch"));
}
$("run").addEventListener("click", runPaste);
$("fetch").addEventListener("click", runFetch);
$("print").addEventListener("click", () => window.print());
$("url").addEventListener("keydown", (e) => { if (e.key === "Enter") runFetch(); });
$("sample").addEventListener("click", () => {
  $("paste").value = [
    "★★★★★  Putih, L   bagus banget pakenya sama bahannya bagus luamayan tebel",
    "★★★★☆  Putih, L   nyaman bet dah pokoknya, bahannya tebel cuman pas dateng kok ada dikit noda kecil ya, tapi ini gacor sih bagus banget desainnya",
    "★★★☆☆  Putih, M   di tampilan sebelom beli, warna tulisannya ijo, pas dateng warna tulisannya hitem",
    "★★☆☆☆  Hitam, L   Pas sampe koyak bajunya",
    "★☆☆☆☆  Putih, L   produk tidak sesuai deskripsi, warna hijau tapi realitanya hitam, kalo emg terima dari pabrikan nya hitam kenapa ga pasang foto hitam aja?",
  ].join("\n");
  $("product").value = "Kaos Boxy Retro"; showError(""); $("paste").focus();
});
$("clear").addEventListener("click", () => { $("paste").value = ""; $("product").value = ""; $("url").value = ""; $("shared-note").hidden = true; showError(""); $("paste").focus(); });
$("paste").addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") runPaste(); });

/* ---------- Share menu: /?title=...&text=...&url=... ---------- */
function sharedFrom(search) {
  const q = new URLSearchParams(search);
  return [q.get("title"), q.get("text"), q.get("url")].filter(Boolean).join("\n").trim();
}
function takeShared() {
  const shared = sharedFrom(location.search);
  if (!shared) return;
  try { history.replaceState(null, "", location.pathname); } catch (e) { /* keep the query */ }  // do not leave review text in the address bar
  const note = $("shared-note");
  if (/^https?:\/\/\S+$/.test(shared)) {  // only a link arrived, not review text
    note.textContent = tr("sharedLinkOnly"); note.hidden = false;
    if (!$("intab-link").hidden) { $("url").value = shared; selectInput("link", false); }
    return;
  }
  $("paste").value = shared;
  note.textContent = tr("sharedOk"); note.hidden = false;
  selectInput("paste", false);
}

/* ---------- install and offline ---------- */
let deferredInstall = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredInstall = e; $("install").hidden = false; });
$("install").addEventListener("click", () => {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  deferredInstall.userChoice.finally(() => { deferredInstall = null; $("install").hidden = true; });
});
window.addEventListener("appinstalled", () => { $("install").hidden = true; });
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready)
    .then(() => { document.documentElement.dataset.sw = "ready"; }).catch(() => { document.documentElement.dataset.sw = "failed"; });
}

async function loadConfig() {
  try {
    const cfg = await (await fetch("/api/config")).json();
    if (!cfg.url_box) return;
    $("limit").max = cfg.max_limit; $("limit").value = cfg.default_limit;
    $("intab-link").hidden = false;
    $("intabs").style.gridAutoColumns = "1fr";
  } catch (e) { /* the link tab simply stays hidden */ }
}

applyLang();
takeShared();
loadConfig();
</script>
