<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0f6b5a">
<title>BedahReview</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="icons/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BedahReview">
<style>
/* Phone first: one column up to 480px wide, 16px gutters, 44px touch targets, safe-area padding.
   A 2x2 board of four tabs: Perbaiki (Fix) and Balas (Respond) on top as the main ones, Abaikan (Ignore) and Pertahankan (Keep) below. Light is the default; dark only after the seller taps the theme button. */
:root {
  --bg: #f6f7f5; --surface: #ffffff; --ink: #17201c; --muted: #5d6963; --line: #dde2de; --field: #7d8782; --quote: #f3f5f2;
  --accent: #0f6b5a; --on-accent: #ffffff; --accent-soft: #dff1ec;
  --fix: #9a4d00; --fix-soft: #fff1e0; --fight: #b3263e; --fight-soft: #fde8ec;
  --ignore: #5f6864; --ignore-soft: #eef0ef; --check: #4338ca; --keep: #166534; --keep-soft: #def5e4;
  --font-ui: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --gutter: 16px; --radius: 14px;
  --bar: #ffffff; --shadow: none; --rival: #4338ca; --rival-soft: #eceafc;
  --summary-soft: #e9f3ef; --summary-line: #cfe3db; --accent-ink: #0b4f42;
}
:root[data-theme="dark"] {
  --bg: #111614; --surface: #1a211e; --ink: #e8eeea; --muted: #9aa8a1; --line: #2c3632; --field: #6b7872; --quote: #222a26;
  --accent: #4fc2a8; --on-accent: #0b1411; --accent-soft: #163a33;
  --fix: #f0a24a; --fix-soft: #33261a; --fight: #f27088; --fight-soft: #351c22;
  --ignore: #a3aca8; --ignore-soft: #242b28; --check: #a5b4fc; --keep: #86efac; --keep-soft: #12281a;
  --bar: #1a211e; --rival: #a5b4fc; --rival-soft: #232647;
  --summary-soft: #1b2a25; --summary-line: #2c4a41; --accent-ink: #7fd1b8;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-ui); }
h1, h2, h3, p, ol, ul { margin: 0; }
h2 { font-size: 1.1rem; line-height: 1.3; font-weight: 800; }
h3 { font-size: 1rem; line-height: 1.3; font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h2[tabindex="-1"]:focus, .error:focus { outline: none; }

/* ---------- frame ---------- */
.topbar { position: sticky; top: 0; z-index: 10; background: var(--bar); border-bottom: 1px solid var(--line);
  padding: env(safe-area-inset-top) max(var(--gutter), env(safe-area-inset-right)) 0 max(var(--gutter), env(safe-area-inset-left)); }
.topbar-in { max-width: 480px; margin: 0 auto; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; }
.brand .wm span { color: var(--accent); }
button.brand { background: none; border: 0; padding: 0; margin: 0; color: inherit; font-family: inherit; text-align: left; cursor: pointer; min-height: 44px; }  /* the logo is the way home: a button that looks like the old plain logo */
.logo { width: 30px; height: 30px; color: var(--ink); flex: none; }
.tools { display: flex; align-items: center; gap: 8px; }
.lang { display: inline-flex; gap: 2px; min-height: 44px; min-width: 44px; padding: 0 2px; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 700; font-size: 0.85rem; cursor: pointer; align-items: center; justify-content: center; }
.theme { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
main { max-width: 480px; margin: 0 auto; display: grid; gap: 14px; align-content: start;
  padding: 16px max(var(--gutter), env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(var(--gutter), env(safe-area-inset-left)); }
.bottombar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.bottombar-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; }
.nav { min-height: 56px; display: grid; place-items: center; align-content: center; gap: 2px; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
.nav[aria-current="page"] { color: var(--accent); }
.nav[disabled] { opacity: 0.4; cursor: default; }

/* ---------- controls ---------- */
.card-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 12px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--ignore-soft); border-radius: 12px; }
.seg button { min-height: 44px; padding: 0 8px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-weight: 700; font-size: 0.92rem; cursor: pointer; }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
label.field, .fld { display: grid; gap: 4px; font-size: 0.82rem; font-weight: 700; color: var(--muted); }
textarea, input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--field); border-radius: 10px; width: 100%; }
textarea { min-height: 190px; resize: vertical; font: 0.9rem/1.6 var(--font-mono); padding: 12px; }
.ta-wrap { position: relative; } .ta-wrap textarea { padding-right: 52px; }
.ta-clear { position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
input, select { min-height: 44px; padding: 0 12px; font-size: 1rem; /* 16px stops iOS zooming into the field */ }
textarea::placeholder, input::placeholder { color: var(--muted); opacity: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid transparent; font: inherit; font-weight: 700; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--on-accent); width: 100%; }
.btn.ghost { background: var(--surface); color: var(--accent); border-color: var(--line); min-height: 44px; font-size: 0.9rem; }
.btn[disabled] { opacity: 0.55; cursor: progress; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn.ghost { flex: 1 1 auto; }
details summary { cursor: pointer; font-weight: 600; color: var(--accent); min-height: 44px; display: flex; align-items: center; }
details pre { margin: 0 0 4px; padding: 12px; background: var(--quote); border-radius: 10px; font: 0.8rem/1.6 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.steps-list { padding-left: 1.3em; display: grid; gap: 6px; font-size: 0.92rem; }
.callout { border-radius: 10px; padding: 10px 12px; font-size: 0.88rem; font-weight: 600; background: var(--accent-soft); color: var(--ink); border: 1px solid var(--line); }
.callout.warn { background: var(--fix-soft); color: var(--fix); border-color: currentColor; }
.callout.hot { background: var(--fight-soft); color: var(--fight); border-color: currentColor; }
.error { display: flex; gap: 10px; align-items: flex-start; background: var(--fight-soft); color: var(--fight); border: 1px solid currentColor; border-radius: 10px; padding: 10px 12px; font-weight: 600; }
.error svg { margin-top: 3px; }
.chip { display: inline-flex; align-items: center; font-size: 0.75rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.fix { color: var(--fix); background: var(--fix-soft); border-color: currentColor; }
.chip.hot { color: var(--fight); background: var(--fight-soft); border-color: currentColor; }
.chip.soft { background: var(--ignore-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- loading ---------- */
.loading { text-align: center; padding: 48px 8px; display: grid; gap: 10px; justify-items: center; }
.spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- results ---------- */
.res-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.panel, .stack { display: grid; gap: 12px; }
.cand { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; }
.cand input { width: 22px; height: 22px; min-height: 22px; margin: 2px 0 0; padding: 0; accent-color: var(--accent); }
.cand .t { font-size: 0.92rem; overflow-wrap: anywhere; }
.cand .meta { font-size: 0.8rem; color: var(--muted); }
.cmp-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table.cmp { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
table.cmp th, table.cmp td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: center; font-variant-numeric: tabular-nums; }
table.cmp th:first-child { text-align: left; font-weight: 600; min-width: 130px; }
table.cmp thead th { font-size: 0.78rem; color: var(--muted); }
table.cmp tr.sec th { background: var(--ignore-soft); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
table.cmp td.top.bad { color: var(--fight); font-weight: 800; } table.cmp td.top.good { color: var(--keep); font-weight: 800; }
.rule { font-size: 0.9rem; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.panel[data-b="fix"] { --c: var(--fix); } .panel[data-b="fight"] { --c: var(--fight); } .panel[data-b="ignore"] { --c: var(--ignore); } .panel[data-b="keep"] { --c: var(--keep); }
.stars { color: var(--fix); letter-spacing: 1px; white-space: nowrap; }
blockquote { margin: 0; padding: 8px 12px; border-left: 4px solid var(--c); background: var(--quote); border-radius: 0 8px 8px 0; display: grid; gap: 2px; overflow-wrap: anywhere; font-size: 0.95rem; }
blockquote .src { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
.full summary { font-size: 0.85rem; min-height: 44px; }
.full p { font-size: 0.88rem; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.why { font-size: 0.92rem; color: var(--muted); }
.draft { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); overflow: hidden; }
.draft-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px 2px 12px; background: var(--ignore-soft); }
.draft-head .lbl { font-size: 0.75rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
.copy { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: var(--accent); font: inherit; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
.copy.done { color: var(--keep); }
.draft .bahasa { padding: 12px; font-size: 0.95rem; overflow-wrap: anywhere; white-space: pre-wrap; user-select: text; -webkit-user-select: text; }
.empty { border: 2px dashed var(--line); border-radius: var(--radius); padding: 20px; color: var(--muted); text-align: center; }
.ignore-list { display: grid; gap: 8px; list-style: none; padding: 0; }
.ignore-list li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 0.92rem; overflow-wrap: anywhere; }
.foot { font-size: 0.8rem; color: var(--muted); }
/* ---------- sign-in screens ---------- */
body:not(.ready) .workspace, body:not(.ready) .bottombar { visibility: hidden; }  /* no flash of the app before we know whether to ask for a sign-in */
body.gated .bottombar, body.gated #fixes-btn, body.gated #logout-row { display: none; }
.gate { max-width: 440px; margin: 0 auto; padding: 24px max(var(--gutter), env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(var(--gutter), env(safe-area-inset-left)); }
.gate-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: grid; gap: 14px; }
.gate-step { display: grid; gap: 14px; }
.gate h1 { margin: 0 0 4px; font-size: 1.4rem; line-height: 1.25; font-weight: 800; letter-spacing: -0.01em; }
.gate h1:focus { outline: none; }
.gbtn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 52px; border-radius: 12px; border: 1px solid #dadce0; background: #fff; color: #1f1f1f; font: inherit; font-weight: 700; cursor: pointer; }
.gbtn svg { width: 20px; height: 20px; flex: none; }
/* account menu: who is signed in, sign out, privacy, and (apart, in red) deleting the account */
.acct { position: relative; }
.avatar { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 800; font-size: 1.05rem; cursor: pointer; display: grid; place-items: center; padding: 0; text-transform: uppercase; }
.acct-menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; width: min(300px, calc(100vw - 2 * var(--gutter))); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18); padding: 6px; display: grid; }
.acct-who { display: grid; gap: 2px; padding: 10px 12px 12px; border-bottom: 1px solid var(--line); margin-bottom: 4px; overflow-wrap: anywhere; }
.mitem { display: flex; align-items: center; width: 100%; min-height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: none; color: var(--ink); font: inherit; font-weight: 600; text-align: left; text-decoration: none; cursor: pointer; }
.mitem:hover, .mitem:focus-visible { background: var(--accent-soft); }
.mitem.danger { color: var(--fight); font-weight: 500; font-size: 0.88rem; }
.mitem.danger:hover, .mitem.danger:focus-visible { background: var(--fight-soft); }
.acct-menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
#delete-panel { display: grid; gap: 10px; padding: 8px 12px 12px; } #delete-panel[hidden] { display: none; }
#delete-panel h3 { margin: 0; font-size: 0.95rem; } #delete-panel p { margin: 0; }
/* a free analysis before signing in: the counts show, the details wait behind this box */
.unlock { justify-items: center; text-align: center; padding: 22px 18px; border-color: var(--accent); }
.unlock h3 { margin: 0; font-size: 1.1rem; } .unlock p { margin: 0; }
.unlock .lock { width: 28px; height: 28px; color: var(--accent); }
#view-results.locked #panels, #view-results.locked #notes, #view-results.locked #feedback,
#view-results.locked #rivals-open, #view-results.locked #start button { display: none !important; }
.foot a { color: inherit; }
.unlock a { color: inherit; }
/* a phone header has room for four things: a visitor gets "Masuk" and the language; the theme switch moves into the account menu */
.has-acct #theme, .visitor #theme, .visitor #fixes-btn { display: none; }
.theme.fixes-pill { width: auto; padding: 0 16px 0 12px; border-radius: 999px; display: inline-flex; gap: 8px; font: inherit; font-weight: 700; font-size: 0.9rem; }
.mitem.m-only { display: none; }
#acct-person { display: none; } .visitor #acct-person { display: block; } .visitor #acct-initial { display: none; }
.visitor .avatar { background: var(--accent-soft); color: var(--accent-ink); }
.mitem.check { gap: 10px; font-weight: 600; font-size: 0.92rem; } .mitem.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
#check-btn { display: none !important; }
@media (min-width: 900px) { #check-btn { display: inline-flex !important; } }
body.gated #check-btn { display: none !important; }
#check-btn.on { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
@media (max-width: 479px) { .has-acct .mitem.m-only { display: flex; } }
@media (min-width: 900px) { .has-acct #theme, .visitor #theme { display: grid; } #acct-theme { display: none; } }
.gbtn[disabled], .btn[disabled] { opacity: 0.6; cursor: progress; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 0.85rem; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.otp { display: flex; gap: 8px; justify-content: center; }
.otp input { width: 46px; height: 56px; min-height: 56px; padding: 0; text-align: center; font-size: 1.5rem; font-weight: 800; border-radius: 12px; font-variant-numeric: tabular-nums; }
.gate .btn.ghost { width: 100%; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 0.92rem; font-weight: 600; cursor: pointer; }
.check input { width: 22px; height: 22px; min-height: 22px; padding: 0; margin: 0; accent-color: var(--accent); flex: none; }
#start { display: grid; gap: 8px; }
.gate-card p a { color: inherit; }
.gate-links { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px 12px; }
.gate-links a { color: var(--accent); font-weight: 700; min-height: 44px; display: inline-flex; align-items: center; }
@media (min-width: 900px) { .gate { padding-top: 56px; } .gate-card { padding: 32px; box-shadow: var(--shadow); } }
main, #view-results, #view-fixes, #view-history, .panel, .stack { grid-template-columns: minmax(0, 1fr); }  /* one column that never grows past its box, even for a long product name */
.start { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--accent-soft); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.start > div { flex: 1 1 220px; min-width: 0; display: grid; gap: 2px; }
.start .eb { font-size: 0.75rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.start .st { font-weight: 700; overflow-wrap: anywhere; }
.start .btn.primary { width: auto; flex: none; }


/* ---------- shared pieces (new) ---------- */
.workspace { display: block; }
.col-2, .dsk { display: none; }
/* phone: the two sections take turns; the bottom bar switches between them */
.workspace[data-section="rivals"] > main { display: none; }
.workspace[data-section="rivals"] > .col-2 { display: grid; gap: 14px; align-content: start; max-width: 480px; margin: 0 auto;
  padding: 16px max(var(--gutter), env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(var(--gutter), env(safe-area-inset-left)); }
.want { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.85rem; font-weight: 700; color: var(--muted); }
.want .seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 52px; }
.group { display: grid; gap: 10px; }
.group h3 { display: flex; align-items: baseline; gap: 8px; }
.group h3 small { font-weight: 500; color: var(--muted); font-size: 0.85rem; }
.group.learn h3 { color: var(--keep); } .group.avoid h3 { color: var(--fix); } .group.ignore h3 { color: var(--ignore); }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-head .chips { justify-content: flex-end; }
.card-head .chips .chip { border: 0; background: none; padding: 0; min-height: 0; font-size: 0.8rem; }  /* labels, not buttons */
.panel .callout { padding: 8px 12px; font-size: 0.82rem; }
.card-head .ttl { display: grid; gap: 2px; min-width: 0; } .vtxt { font-size: 0.8rem; color: var(--muted); }
.lbl-b { font-weight: 800; color: var(--ink); }
.actions { display: grid; gap: 10px; }
.plain { border: 0; background: none; color: var(--accent); font: inherit; font-weight: 700; cursor: pointer; padding: 0 0 0 4px; min-height: 36px; }
.plain.strong { padding: 0; }
.opts summary { font-size: 0.9rem; }
.fallback { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--bg); display: grid; gap: 8px; }
.error strong { display: block; font-size: 1.05rem; margin-bottom: 2px; }
.error > div { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.legend { padding: 0 2px; }
#legend, .legend-dlg { display: grid; gap: 6px; font-size: 0.9rem; color: var(--muted); padding-bottom: 6px; }
#legend b, .legend-dlg b { margin-right: 6px; }
.stepper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 0; padding: 6px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.stepper li { display: flex; align-items: center; gap: 8px; padding: 4px 10px; font-size: 0.88rem; font-weight: 600; color: var(--muted); min-width: 0; }
.stepper .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line); font-size: 0.78rem; flex: none; }
.stepper li.on { color: var(--ink); } .stepper li.on .dot { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.stepper li.done .dot { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.stepper .dot svg { width: 14px; height: 14px; }
.rcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; }
.rcard h2 { font-size: 1.25rem; }
.ownbox { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; min-width: 0; }
.ownbox small { display: block; color: var(--muted); font-size: 0.78rem; }
.ownbox span { min-width: 0; overflow-wrap: anywhere; }
.ownbox b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }  /* a 150-character title reads as two lines, the rest in the tooltip */
.ownbox > button { flex: none; white-space: nowrap; min-height: 44px; }
.nextlist { display: grid; gap: 8px; list-style: none; padding: 0; margin: 0; }
.nextlist li { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; min-height: 48px; padding: 6px 6px 6px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: 15px; }
.nextlist li > svg { color: var(--accent); }
.nextlist li .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--accent); justify-self: center; }
.nextlist li.keep .dot { border-color: var(--line); background: var(--accent-soft); }
.nextlist li.done > span:not(.dot) { color: var(--muted); }
.nextlist button { min-height: 44px; padding: 0 10px; }
.sumfoot { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }  /* the plan's end: back to the results, or a new product, side by side */
.taskbox { display: grid; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.taskbox > .task { border: 0; }
.taskpanel { display: grid; gap: 10px; padding: 4px 14px 14px; }
.taskpanel .row { flex-wrap: wrap; align-items: center; }
.btn.pill { border-radius: 999px; background: var(--surface); color: var(--accent); border-color: var(--line); min-height: 44px; padding: 0 16px; font-size: 0.88rem; }
.cand.on { border: 2px solid var(--accent); padding: 11px; }
.cand .chips { margin-top: 4px; }
.cand .chip { color: var(--ink); background: var(--bg); }
.group-lbl { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
.ins { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
.ins .big { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ins .big b { font-size: 2rem; line-height: 1; font-weight: 800; }
.ins .big i { font-style: normal; font-size: 0.8rem; color: var(--muted); }
.ins .bad { color: var(--fight); font-weight: 800; } .ins .good { color: var(--keep); font-weight: 800; }
.dots { display: flex; gap: 3px; justify-content: center; min-height: 8px; margin-bottom: 2px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots.bad i { background: var(--fight); } .dots.good i { background: var(--keep); }
table.cmp td.top { font-weight: 800; }
table.cmp thead th small { display: block; font-weight: 500; font-size: 0.75rem; }
.dnote { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.dnote p { font-size: 0.9rem; overflow-wrap: anywhere; }
.dnote code { display: block; font: 0.78rem var(--font-mono); color: var(--muted); }
.tag { display: inline-block; margin-right: 6px; padding: 0 9px; border-radius: 999px; border: 1px solid currentColor; font-size: 0.75rem; font-weight: 700; }
.tag.small { color: var(--fix); background: var(--fix-soft); } .tag.fail { color: var(--fight); background: var(--fight-soft); } .tag.skip { color: var(--muted); background: var(--ignore-soft); }
.pcard-more summary { font-size: 0.85rem; }
.badge { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-size: 0.75rem; font-weight: 800; display: grid; place-items: center; }
.track { display: grid; gap: 8px; background: var(--keep-soft); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 0.92rem; }
.track .when { font-weight: 800; color: var(--keep); }
.nums { display: grid; gap: 4px; font-variant-numeric: tabular-nums; font-size: 0.92rem; }
.nums .small-warn { font-size: 0.82rem; color: var(--muted); }
.nums .small-warn.strong { color: var(--fix); font-weight: 700; }
.fixform { display: grid; gap: 8px; }
.fixitem { display: grid; gap: 10px; }
.fixitem .note { overflow-wrap: anywhere; }
.btn.danger { color: var(--fight); border-color: currentColor; }
.drafts { display: grid; gap: 12px; }
.ins.bad .big b:first-child { color: var(--fight); } .ins.good .big b:first-child { color: var(--keep); }
.cand .meta { display: block; }
.cmp-title { padding: 14px 10px 4px; }
#legend .lg-fix, .legend-dlg .lg-fix { color: var(--fix); } #legend .lg-fight, .legend-dlg .lg-fight { color: var(--fight); } #legend .lg-ignore, .legend-dlg .lg-ignore { color: var(--ignore); } #legend .lg-keep, .legend-dlg .lg-keep { color: var(--keep); }

@media (min-width: 900px) {
  :root { --bar: #e6eae7; }  /* flat cards, radius 14: the same tokens as a phone */
  :root[data-theme="dark"] { --bar: #1a211e; }
  html, body { height: 100%; }
  body { overflow: hidden; display: flex; flex-direction: column; }
  .topbar { position: static; flex: none; padding: 0 36px; }
  .topbar-in { max-width: none; min-height: 72px; }
  .workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }  /* 60 / 40: review triage is the main job */
  .col { min-width: 0; overflow-y: auto; padding: 28px 36px 56px; }
  main.col { max-width: none; margin: 0; gap: 18px; }
  .col-2 { display: block; border-left: 2px solid var(--line); }
  .workspace[data-section] > main.col { display: grid; }
  .workspace[data-section] > .col-2 { display: block; max-width: none; margin: 0; padding: 28px 36px 56px; }
  .col-2 .ftile { display: grid; } .col-2 .eyebrow { display: block; }
  .bottombar, .mob { display: none !important; }
  .dsk { display: block; }
  .dsk.f:not([hidden]) { display: flex; } .dsk.g:not([hidden]) { display: grid; } .dsk.i:not([hidden]) { display: inline-flex; }
  .fhead { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  main .fhead { margin-bottom: 0; }
  .ftile { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
  .ftile.rival { background: var(--rival-soft); color: var(--rival); }
  .ftile svg { width: 22px; height: 22px; }
  .ftext { flex: 1 1 250px; min-width: 0; }
  .eyebrow { font-size: 0.75rem; font-weight: 800; letter-spacing: 0.08em; color: var(--accent); }
  .eyebrow.rival { color: var(--rival); }
  .fhead h1 { margin: 0; font-size: 1.8rem; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; }
  .fside { display: flex; align-items: center; gap: 8px; flex: 0 1 auto; max-width: 100%; min-width: 0; margin-left: auto; }
  .pchip { display: flex; align-items: center; gap: 6px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 8px 6px 16px; font-size: 0.92rem; box-shadow: var(--shadow); }
  .pchip b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pchip span { white-space: nowrap; color: var(--muted); }
  .card-box, .card, .rcard, .ins, .dnote { box-shadow: var(--shadow); }
  .card-box { padding: 24px; gap: 16px; }
  .rcard { padding: 24px; gap: 14px; }
  .rcard h2 { font-size: 1.5rem; letter-spacing: -0.01em; }
  .btn.primary { width: 260px; justify-self: start; }  /* a stand-alone primary button on a wide screen: 260 px, left aligned */
  .actions { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  #paste { min-height: 160px; }
  .error { border-radius: var(--radius); padding: 18px 20px; order: -1; }
  .error strong { font-size: 1.25rem; }
  .phead { font-size: 1.5rem; line-height: 1.2; font-weight: 800; letter-spacing: -0.01em; }
  .lead { color: var(--muted); margin-top: -8px; }
  .panel { gap: 14px; }
  .card { border-top: 1px solid var(--line); padding: 20px 22px; }
  .callout { font-weight: 500; } .callout b { font-weight: 800; }
  .card h3 { font-size: 1.15rem; }
  .why b { color: var(--ink); }
  blockquote { border-left-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font: 0.92rem/1.5 var(--font-mono); }
  blockquote .src { font-size: 0.75rem; }
  .drafts { display: grid; gap: 12px; }
  .drafts .draft { display: none; }
  .drafts[data-active="side"] .draft[data-k="side"], .drafts[data-active="chat"] .draft[data-k="chat"], .drafts[data-active="public"] .draft[data-k="public"], .drafts[data-active="report"] .draft[data-k="report"] { display: block; }
  #feature2 .stack { gap: 14px; }
  .cmp-wrap { border-radius: var(--radius); box-shadow: var(--shadow); }
  table.cmp { font-size: 0.95rem; }
}
@media print {
  body { display: block; height: auto; overflow: visible; }
  .workspace { display: block; } .col { overflow: visible; padding: 0; }
  #feature2, .fhead, .steps, .legend { display: none !important; }
}
@media (pointer: fine) and (min-width: 481px) { main { padding-top: 24px; } }

/* ==========================================================================================================
   Final design (canvas page 6): self-hosted fonts, a quieter header, errors where the tap was, rows that look
   like they open, results as a plan with three steps and a summary, a Tugas tab, a bottom sheet for quotes
   (a side panel on a wide screen), and short motion on the main actions. Rules below win over the ones above.
   ========================================================================================================== */
@font-face { font-family: "Plus Jakarta Sans"; src: url("fonts/plus-jakarta-sans.woff2") format("woff2"); font-weight: 200 800; font-style: normal; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url("fonts/jetbrains-mono.woff2") format("woff2"); font-weight: 100 800; font-style: normal; font-display: swap; }
:root { --scrim: rgba(23, 32, 28, 0.38); --line-strong: #bfc8c3; --ease: cubic-bezier(0.2, 0.7, 0.2, 1); }
:root[data-theme="dark"] { --scrim: rgba(0, 0, 0, 0.55); --line-strong: #48544e; }
body { -webkit-font-smoothing: antialiased; transition: background-color 0.2s, color 0.2s; }

/* header: the wordmark, "Masuk" as the one pill, language as a small outlined ID / EN */
.brand { font-weight: 500; font-size: 1rem; gap: 7px; }
.wm { font-size: 18.5px; line-height: 1; letter-spacing: -0.035em; white-space: nowrap; }
.wm b { font-weight: 700; color: var(--ink); } .wm i { font-style: normal; font-weight: 500; color: var(--accent); }
.tools { gap: 6px; }
.lang .pill { display: inline-flex; gap: 4px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 700; color: var(--muted); }
.lang .pill em { font-style: normal; color: var(--ink); }
@media (max-width: 359px) { .lang .alt { display: none; } }  /* the smallest phones: only the current language, a tap still switches */
#signin-btn { min-height: 44px; padding: 0 16px; font-size: 15px; font-weight: 700; color: var(--accent); background: var(--surface); border: 1px solid var(--line); }
.acct-menu { transform-origin: top right; }
.acct-menu:not([hidden]) { animation: pop 0.16s var(--ease); }
#acct-fixes { display: none !important; }  /* Tugas has its own tab now */
@media (max-width: 899px) { #fixes-btn { display: none !important; } }
@media (min-width: 900px) { .visitor #fixes-btn, .has-acct #fixes-btn { display: inline-flex; } #fixes-btn .lbl { display: inline; } .theme.fixes-pill { width: auto; padding: 0 16px; } }
#fixes-btn .badge { position: static; min-width: 22px; height: 22px; border-radius: 999px; font-size: 12px; }
@media (min-width: 900px) { #signin-btn { order: 5; } }  /* a wide header: Tugas, language, theme, then Masuk last */
body.sheet-open { overflow: hidden; }
body.free-locked #panels, body.free-locked #board-cap { display: none !important; }  /* a free result before sign-in: the counts show, the quotes and drafts wait */

/* phone, and a tablet held upright: one column, a little wider from 600px */
@media (min-width: 600px) and (max-width: 899px) {
  main, .workspace[data-section="rivals"] > .col-2, .topbar-in, .bottombar-in { max-width: 600px; }
}
.nav .ic { position: relative; display: inline-flex; }
.nav .badge { top: -7px; right: auto; left: 13px; border: 2px solid var(--surface); }
.badge:not([hidden]) { animation: pop 0.2s var(--ease); }

/* first screen: what the app does, and how, folded */
.boxhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.boxhead label { font-weight: 700; font-size: 0.95rem; }
.qbtn { width: 44px; height: 44px; margin: -8px -8px -8px 0; border: 0; background: none; color: var(--accent); font: inherit; font-weight: 800; font-size: 1.05rem; cursor: pointer; border-radius: 50%; }
.chip { display: flex; align-items: center; gap: 8px; background: var(--accent-soft); color: var(--accent-ink); border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; font-weight: 600; }
.chip svg.i { flex: none; }
#url { min-height: 132px; font: 15px/1.5 var(--font-ui); padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--field); background: var(--surface); }
#view-input.linkmode #url { min-height: 72px; }
#tips { display: grid; gap: 8px; }
.linkbtn.quiet { color: var(--muted); font-weight: 600; }
.hero { display: grid; gap: 10px; }
.hero h1 { font-size: 23px; line-height: 1.25; font-weight: 800; letter-spacing: -0.01em; }
@media (max-width: 359px) { .hero h1 { font-size: 20px; } }
.howdots { display: inline-flex; gap: 4px; margin-left: 10px; }
.howdots span { width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 800; display: grid; place-items: center; }
.numsteps { list-style: none; padding: 0 0 12px; display: grid; gap: 10px; }
.numsteps li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font-size: 15px; color: var(--ink); }
.numsteps .n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 12.5px; font-weight: 800; }

/* rows that open: ink text, a grey chevron on the right that turns, thin lines above and below */
details.xp { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
details.xp + details.xp { border-top: 0; }
details.xp > summary { list-style: none; color: var(--ink); font-weight: 600; font-size: 0.95rem; justify-content: space-between; gap: 12px; padding: 0 2px; }
details.xp > summary::-webkit-details-marker { display: none; }
details.xp > summary::after { content: ""; width: 8px; height: 8px; flex: none; margin: 0 6px 4px 0; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform 0.22s var(--ease); }
details.xp[open] > summary::after { transform: translate(0, 4px) rotate(-135deg); }
details.xp.closing > summary::after { transform: rotate(45deg); }
.board button[data-on][data-b="fix"] { background: var(--fix-soft); border: 2px solid var(--fix); } .board button[data-on][data-b="fight"] { background: var(--fight-soft); border: 2px solid var(--fight); }
.board button[data-on][data-b="ignore"] { background: var(--ignore-soft); border: 2px solid var(--ignore); } .board button[data-on][data-b="keep"] { background: var(--keep-soft); border: 2px solid var(--keep); }
#fixes-btn.on { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
#stabs { position: sticky; top: 50px; z-index: 1; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); justify-self: stretch; border-radius: 12px; }
#stabs { margin-bottom: 12px; }
#stabs button { padding: 0 6px; border-radius: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-box { grid-template-columns: minmax(0, 1fr); }
[tabindex="-1"]:focus { outline: none; }  /* headings take focus so screen readers start there; the ring is for keyboard targets */
.stephd .stepper { flex: 0 1 auto; min-width: 0; } .stephd .stepper li { padding: 4px 6px; gap: 4px; font-size: 0.78rem; } .stephd .stepper .dot { width: 22px; height: 22px; }
@media (max-width: 459px) { .stephd .stepper li:not(.on) .full, .stephd .stepper li:not(.on) .short { display: none; } }  /* a phone: only the current step keeps its name */
details.xp > .xp-body { padding: 2px 2px 12px; display: grid; gap: 8px; }

/* fields, errors and notices: the message sits where the seller tapped */
input.filled { border: 2px solid var(--accent); }
input[aria-invalid="true"] { border: 2px solid var(--fight); }
.ferr { display: flex; gap: 8px; align-items: flex-start; color: var(--fight); font-size: 0.88rem; font-weight: 600; margin-top: -4px; }
.ferr svg { margin-top: 3px; }
.notice { display: grid; gap: 10px; padding: 12px; border-radius: 12px; background: var(--fix-soft); border: 1px solid var(--fix); color: var(--ink); font-size: 0.92rem; font-weight: 600; }
.notice .t { display: flex; gap: 8px; align-items: flex-start; } .notice .t svg { color: var(--fix); margin-top: 3px; }
.notice .btn.ghost { width: 100%; }
.hint { font-size: 0.88rem; color: var(--muted); margin-top: -4px; } .hint b { color: var(--ink); }
.quota { font-size: 0.9rem; font-weight: 700; color: var(--ink); text-align: center; }
.btn.off, .btn[aria-disabled="true"] { background: var(--ignore-soft); color: var(--muted); border-color: var(--line); }
.error:not([hidden]), .ferr:not([hidden]), .notice:not([hidden]) { animation: rise 0.22s var(--ease); }
.error .btn.ghost { margin-top: 8px; width: 100%; }
.error .sub { display: block; font-weight: 500; font-size: 0.85rem; margin-top: 2px; }

/* results: one calm headline, four equal tiles, then the plan */
.res-top { display: grid; gap: 6px; }
.res-meta { font-size: 0.88rem; color: var(--muted); overflow-wrap: anywhere; }
#results-h { font-size: 20px; line-height: 1.3; font-weight: 800; letter-spacing: -0.01em; }
.btn, .nav, .copy, .task, .opt { transition: transform 0.12s, background-color 0.2s, border-color 0.2s, color 0.2s, opacity 0.2s; }
.btn:active:not([disabled]), .board button:active, .nav:active, .task:active { transform: scale(0.97); }
.plan { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 16px; padding: 4px 14px 8px; display: grid; }
.plan .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 44px; }
.eb { font-size: 0.75rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.plan .meta { font-size: 0.8rem; font-weight: 700; color: var(--accent); }
.plan h3 { font-size: 17px; font-weight: 800; line-height: 1.3; padding-bottom: 6px; }
.plan .go-d { display: none; }
.prow { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 52px; padding: 6px 0; border: 0; border-top: 1px solid var(--line); background: none; color: inherit; font: inherit; text-align: left; width: 100%; cursor: pointer; }
.prow .k { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--accent); color: var(--accent); display: grid; place-items: center; font-size: 12.5px; font-weight: 800; background: var(--surface); transition: background-color 0.25s, color 0.25s; }
.prow .k svg { width: 14px; height: 14px; stroke-width: 3; }
.prow.done .k { background: var(--accent); color: var(--on-accent); }
.prow .t { display: grid; min-width: 0; } .prow .t b { font-size: 15px; font-weight: 700; line-height: 1.35; } .prow .t span { font-size: 13px; color: var(--muted); }
.prow .tm { font-size: 12.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.prow .ev { display: none; }
.stickyfoot { position: sticky; bottom: calc(56px + env(safe-area-inset-bottom)); z-index: 5; display: grid; gap: 2px; margin: 0 calc(-1 * var(--gutter)); padding: 10px var(--gutter) 8px; background: var(--bg); border-top: 1px solid var(--line); }
.stickyfoot .plain { justify-self: center; min-height: 44px; }
.stickyfoot .of { display: none; }

/* the three steps */
.stephd { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.back { min-height: 44px; display: inline-flex; align-items: center; gap: 2px; font: inherit; font-weight: 700; font-size: 0.9rem; color: var(--accent); background: none; border: 0; margin-left: -6px; padding: 0 6px; cursor: pointer; }
.stephd .stepper { flex: 0 1 auto; grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: max-content; }  /* the plan has 1 to 3 steps: the pill is as wide as they are */
.stepper { gap: 2px; padding: 4px; }
.stepper li { justify-content: center; gap: 5px; padding: 4px 6px; min-height: 36px; font-size: 0.8rem; font-weight: 700; white-space: nowrap; border-radius: 999px; transition: color 0.2s; }
.stepper .dot { width: 24px; height: 24px; font-size: 0.75rem; transition: background-color 0.25s, border-color 0.25s, color 0.25s; }
.stepper .short { display: none; }
@media (max-width: 359px) { .stepper .full { display: none; } .stepper .short { display: inline; } }
.stask { display: grid; gap: 8px; }

/* quotes: a bottom sheet on a phone, a side panel on a wide screen */
#sheet { position: fixed; inset: 0; z-index: 40; }
#sheet .scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 0.24s; }
#sheet.open .scrim { opacity: 1; }
.sheet-box { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 600px; max-height: 85vh; overflow-y: auto; overscroll-behavior: contain; background: var(--bg); border-radius: 20px 20px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); display: grid; gap: 12px; align-content: start; transform: translateY(100%); transition: transform 0.3s var(--ease); }
#sheet.open .sheet-box { transform: none; }
.sheet-box .grab { width: 40px; height: 4px; border-radius: 999px; background: var(--line-strong); margin: 4px auto 0; }
.sheet-hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; position: sticky; top: -8px; background: var(--bg); padding: 6px 0; z-index: 1; }
.sheet-hd h2 { font-size: 18px; } .sheet-hd h2:focus { outline: none; }
.xbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); border: 1px solid var(--line); background: var(--surface); cursor: pointer; flex: none; padding: 0; }
#sheet.dlg .sheet-box { top: 50%; bottom: auto; left: 50%; right: auto; width: min(480px, calc(100% - 32px)); border-radius: 22px; padding: 24px; transform: translate(-50%, -46%); opacity: 0; transition: transform 0.24s var(--ease), opacity 0.24s; background: var(--surface); }
#sheet.dlg.open .sheet-box { transform: translate(-50%, -50%); opacity: 1; }
#sheet.dlg .grab { display: none; }
.toast2 { position: fixed; left: 16px; right: 16px; top: calc(64px + env(safe-area-inset-top)); z-index: 45; pointer-events: none; max-width: 440px; margin: 0 auto; background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 4px 16px rgba(23, 32, 28, 0.12); font-size: 0.85rem; font-weight: 600; padding: 10px 14px; border-radius: 12px; text-align: center; animation: rise 0.24s var(--ease); }

/* motion: short, and only where something moves or appears; off when the system asks for less motion */
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fwd { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes bwd { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: none; } }
.enter { animation: rise 0.26s var(--ease); }
.enter-fwd { animation: fwd 0.26s var(--ease); }
.enter-bwd { animation: bwd 0.26s var(--ease); }

  #sheet.open:not(.dlg) .sheet-box { transform: none; }

}
@media (min-width: 1200px) {

@media (prefers-reduced-motion: reduce) {

}

  main { max-width: none; padding-bottom: 0; }
}

.st.done { background: var(--keep-soft); color: var(--keep); } .st.open { background: var(--fix-soft); color: var(--fix); } .st.expired { background: var(--ignore-soft); color: var(--ignore); }
.pick { display: flex; gap: 14px; align-items: flex-start; min-height: 56px; padding: 14px; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); cursor: pointer; }
.pick input { width: 24px; height: 24px; margin: 1px 0 0; accent-color: var(--rival); flex: none; }
.pick.on { border-color: var(--rival); background: var(--rival-soft); }
.pick .t { font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; display: block; } .pick .m { display: block; font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
.buyer.rival .lab { color: var(--rival); }
.todo.keep { background: var(--keep-soft); } .todo.keep .lab { color: var(--keep); }
.pickfoot { display: grid; gap: 6px; } .pickfoot .small { text-align: center; font-size: 12px; }
#done-anim { position: fixed; inset: 0; z-index: 80; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 0 32px; }
#done-anim[hidden] { display: none; }
#done-anim h2 { font-size: 1.9rem; font-weight: 800; } #done-anim p { color: var(--muted); font-size: 1rem; margin-top: 6px; }
#done-anim .ring { stroke-dasharray: 189; stroke-dashoffset: 189; } #done-anim .tick { stroke-dasharray: 50; stroke-dashoffset: 50; } #done-anim .pop { opacity: 0; }
#done-anim.play .ring { animation: dring 0.55s ease-out forwards; } #done-anim.play .tick { animation: dtick 0.4s 0.45s ease-out forwards; } #done-anim.play .pop { animation: dpop 0.4s 0.8s ease-out forwards; }
@keyframes dring { to { stroke-dashoffset: 0; } } @keyframes dtick { to { stroke-dashoffset: 0; } } @keyframes dpop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #done-anim .ring, #done-anim .tick { stroke-dashoffset: 0; animation: none !important; } #done-anim .pop { opacity: 1; animation: none !important; } }
.res-top { position: relative; }
/* a wide screen: one scroll area, a centred column; Hasil Bedah gets two columns with the summary kept in view; Tugas two boxes per row */
@media (min-width: 900px) {
  .workspace { display: block; overflow-y: auto; }
  .workspace > main.col { max-width: 792px; margin: 0 auto;  /* 720 px of content */ overflow: visible; padding: 32px 36px 72px; }
  .workspace.wide > main.col { max-width: 1240px; }
  .hero:not([hidden]) { display: grid; } .hero h1 { font-size: 38px; }
  .res-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .res-top .res-meta { flex: 1 0 100%; } .res-top #results-h { flex: 1; }
  #view-results { grid-template-columns: minmax(0, 1fr) 380px !important; column-gap: 32px; align-items: start; }
  #view-results > * { grid-column: 1; }
  #view-results > .res-top { grid-column: 1 / -1; }
  #view-results > #sumbox { grid-column: 2; grid-row: 2 / span 12; position: sticky; top: 16px; }
  .tgrid { grid-template-columns: 1fr 1fr; align-items: start; }
  .tgrid > .tsec, .tgrid > .full-row { grid-column: 1 / -1; }
  .tgrid > .tbox:only-child { grid-column: 1 / -1; width: 100%; max-width: 560px; justify-self: center; }  /* one box alone sits in the middle, not at the edge of an empty page */
  .rival-wrap { max-width: 720px; }
}
@media (min-width: 900px) and (max-width: 1199px) { #view-results { grid-template-columns: minmax(0, 1fr) 300px !important; } }
@media (min-width: 900px) { .gtabs { flex-wrap: wrap; } }

  sb.auth.onAuthStateChange((event, session) => { cachedToken = session ? session.access_token : ""; setTimeout(() => { if (event === "SIGNED_OUT") onSignedOut(); else if (session) enterApp(session); }, 0); });  // not awaited inside the callback: Supabase asks for that
  const params = new URLSearchParams(location.search), oauthFailed = params.has("error") || params.has("error_description");
  let session = null;
  try { session = (await sb.auth.getSession()).data.session; } catch (e) { /* no session */ }
  cachedToken = session ? session.access_token : "";  // known from the start, so events can still be sent when the page is hidden before any other request
  if (/[?&](code|error|error_code|error_description)=/.test(location.search) || /access_token|error=/.test(location.hash)) { try { history.replaceState(null, "", location.pathname); } catch (e) { /* keep it */ } }
  if (session) { signedIn = true; enterApp(session); return; }
  signedIn = !!cfg.signed_in;  // true for an access-code cookie
  if (signedIn) { showApp(); return; }
  let deleted = false;
  try { deleted = !!sessionStorage.getItem("bedahreview-deleted"); sessionStorage.removeItem("bedahreview-deleted"); } catch (e) { /* ignore */ }
  if (!oauthFailed && !deleted) { showApp(); return; }  // no account yet: the app is open, and the first analysis is free
  showGate("choose", false);
  if (oauthFailed) { dropPending(); showGateError(tr("gErrOauth")); }  // the locked result does not wait for a sign-in that did not happen
  if (deleted) gateInfo(tr("gDeleted"));
}
async function googleSignIn() {  // leaves the page for Google; a locked free result waits in this tab until we are back
  const fail = (msg) => { dropPending(); if ($("gate").hidden) showGate("choose", false); showGateError(msg); };
  showGateError("");
  if (freeLocked && lastData) { try { sessionStorage.setItem(PENDING_KEY, JSON.stringify(lastData)); } catch (e) { /* the result cannot wait: the sign-in still works */ } }
  try {
    const { error } = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + "/" } });
    if (error) fail(authErrorText(error));
  } catch (e) { fail(tr("gErrNet")); }
}

/* "Hapus akun dan data saya": asks twice, deletes on the server, then clears everything this browser holds for the account and reloads. */
$("delete-open").addEventListener("click", () => { $("delete-panel").hidden = false; $("delete-error").hidden = true; $("delete-confirm").textContent = tr("delConfirm"); $("delete-cancel").focus(); });
$("delete-cancel").addEventListener("click", () => { $("delete-panel").hidden = true; });
$("delete-confirm").addEventListener("click", async () => {
  const btn = $("delete-confirm"), fail = (msg) => { $("delete-error").textContent = msg; $("delete-error").hidden = false; };
  btn.disabled = true; btn.textContent = tr("delDeleting"); $("delete-error").hidden = true;
  clearTimeout(fixSync.timer); fixSync.dirty = false; eventQueue = [];  // nothing may be sent to an account that is going away
  let done = false;
  try {
    const res = await api("/api/account/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ confirm: "delete" }) });
    if (res.ok) done = true;
    else { const data = await res.json().catch(() => null); fail(data && data.code === "delete_unavailable" ? tr("delUnavailable") : tr("delErr")); }
  } catch (e) { fail(tr("delErr")); }
  btn.disabled = false; btn.textContent = tr("delConfirm");
  if (!done) { resetFixSync(); syncFixes(); syncBoxes(true); return; }  // nothing was deleted: carry on as before
  try { await sb.auth.signOut({ scope: "local" }); } catch (e) { /* the account is gone either way */ }
  try { [FIX_KEY, FIX_OWNER_KEY, DEVICE_KEY, BOX_KEY, HELD_KEY, LOG_KEY].forEach((k) => localStorage.removeItem(k)); sessionStorage.setItem("bedahreview-deleted", "1"); } catch (e) { /* ignore */ }
  forgetJob(); dropPending();
  location.reload();  // a clean page: no review, result or note is left in memory
});
$("signin-btn").addEventListener("click", () => showGate("choose"));
document.addEventListener("visibilitychange", () => { if (!document.hidden) syncBoxes(); });  // back to the app: pick up what another phone changed

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready)
    .then(() => { document.documentElement.dataset.sw = "ready"; }).catch(() => { document.documentElement.dataset.sw = "failed"; });

function applyBox(cfg, first) {  // the link box: shown only when the server says this visitor may use it
  linkBoxOn = !!cfg.url_box; rivalsOn = cfg.rivals === undefined ? linkBoxOn : !!cfg.rivals; renderRival();
  if (cfg.url_box) {
    $("limit").max = cfg.max_limit; $("limit").value = cfg.default_limit; syncLimit();
  }
  syncClear();
}
async function refreshBox() {  // after a sign-in the answer can change: a trusted account gets the link box that a normal one does not
  try { applyBox(await (await api("/api/config")).json(), false); } catch (e) { /* keep what we have */ }
}
async function loadConfig() {
  try {
    const cfg = await (await fetch("/api/config")).json();
    cfgAccess = !!cfg.access; cfgCanDelete = !!cfg.can_delete; cfgFree = !!cfg.free;
    applyBox(cfg, true);
    if (cfg.supabase) await startAuth(cfg);
    else { signedIn = true; renderAccount(); openedOnce(); }  // an access code, or a local run: no sign-in screens
  } catch (e) { /* the link tab simply stays hidden */ }
  document.body.classList.add("ready");
}
