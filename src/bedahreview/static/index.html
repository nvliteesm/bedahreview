<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f6b5a">
<title>BedahReview</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BedahReview">
<style>
/* Phone first: one column up to 480px wide, 16px gutters, 44px touch targets, safe-area padding.
   A 2x2 board of four tabs: Perbaiki (Fix it) and Tanggapi (Fight it) on top as the main ones, Abaikan (Ignore) and Pertahankan (Keep) below. Light and dark follow the system. */
:root {
  --bg: #f6f7f5; --surface: #ffffff; --ink: #17201c; --muted: #5d6963; --line: #dde2de; --quote: #f3f5f2;
  --accent: #0f6b5a; --on-accent: #ffffff; --accent-soft: #dff1ec;
  --fix: #b25a00; --fix-soft: #fff1e0; --fight: #b3263e; --fight-soft: #fde8ec;
  --ignore: #69726e; --ignore-soft: #eef0ef; --check: #4338ca; --keep: #166534; --keep-soft: #def5e4;
  --font-ui: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --gutter: 16px; --radius: 14px;
  --bar: #ffffff; --shadow: none; --rival: #4338ca; --rival-soft: #eceafc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --surface: #1a211e; --ink: #e8eeea; --muted: #9aa8a1; --line: #2c3632; --quote: #222a26;
    --accent: #4fc2a8; --on-accent: #0b1411; --accent-soft: #163a33;
    --fix: #f0a24a; --fix-soft: #33261a; --fight: #f27088; --fight-soft: #351c22;
    --ignore: #a3aca8; --ignore-soft: #242b28; --check: #a5b4fc; --keep: #86efac; --keep-soft: #12281a;
    --bar: #1a211e; --rival: #a5b4fc; --rival-soft: #232647;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --surface: #1a211e; --ink: #e8eeea; --muted: #9aa8a1; --line: #2c3632; --quote: #222a26;
  --accent: #4fc2a8; --on-accent: #0b1411; --accent-soft: #163a33;
  --fix: #f0a24a; --fix-soft: #33261a; --fight: #f27088; --fight-soft: #351c22;
  --ignore: #a3aca8; --ignore-soft: #242b28; --check: #a5b4fc; --keep: #86efac; --keep-soft: #12281a;
  --bar: #1a211e; --rival: #a5b4fc; --rival-soft: #232647;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-ui); }
h1, h2, h3, p, ol, ul { margin: 0; }
h2 { font-size: 1.1rem; line-height: 1.3; font-weight: 800; }
h3 { font-size: 1rem; line-height: 1.3; font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h2[tabindex="-1"]:focus, .error:focus { outline: none; }

/* ---------- frame ---------- */
.topbar { position: sticky; top: 0; z-index: 10; background: var(--bar); border-bottom: 1px solid var(--line);
  padding: env(safe-area-inset-top) max(var(--gutter), env(safe-area-inset-right)) 0 max(var(--gutter), env(safe-area-inset-left)); }
.topbar-in { max-width: 480px; margin: 0 auto; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; }
.brand .wm span { color: var(--accent); }
.logo { width: 30px; height: 30px; color: var(--ink); flex: none; }
.tools { display: flex; align-items: center; gap: 8px; }
.lang { display: inline-flex; gap: 2px; min-height: 44px; padding: 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: inherit; font-weight: 700; font-size: 0.85rem; cursor: pointer; align-items: center; }
.lang .o { padding: 6px 14px; border-radius: 999px; }
.lang .o.on { background: var(--ink); color: var(--surface); }
.theme { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
main { max-width: 480px; margin: 0 auto; display: grid; gap: 14px; align-content: start;
  padding: 16px max(var(--gutter), env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(var(--gutter), env(safe-area-inset-left)); }
.bottombar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.bottombar-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; }
.nav { min-height: 56px; display: grid; place-items: center; align-content: center; gap: 2px; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
.nav[aria-current="page"] { color: var(--accent); }
.nav[disabled] { opacity: 0.4; cursor: default; }

/* ---------- controls ---------- */
.card-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 12px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--ignore-soft); border-radius: 12px; }
.seg button { min-height: 44px; padding: 0 8px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-weight: 700; font-size: 0.92rem; cursor: pointer; }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
label.field, .fld { display: grid; gap: 4px; font-size: 0.82rem; font-weight: 700; color: var(--muted); }
textarea, input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; width: 100%; }
textarea { min-height: 190px; resize: vertical; font: 0.9rem/1.6 var(--font-mono); padding: 12px; }
input, select { min-height: 44px; padding: 0 12px; font-size: 1rem; /* 16px stops iOS zooming into the field */ }
textarea::placeholder, input::placeholder { color: var(--muted); opacity: 0.8; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid transparent; font: inherit; font-weight: 700; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--on-accent); width: 100%; }
.btn.ghost { background: var(--surface); color: var(--accent); border-color: var(--line); min-height: 44px; font-size: 0.9rem; }
.btn[disabled] { opacity: 0.55; cursor: progress; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn.ghost { flex: 1 1 auto; }
details summary { cursor: pointer; font-weight: 600; color: var(--accent); min-height: 44px; display: flex; align-items: center; }
details pre { margin: 0 0 4px; padding: 12px; background: var(--quote); border-radius: 10px; font: 0.8rem/1.6 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.steps-list { padding-left: 1.3em; display: grid; gap: 6px; font-size: 0.92rem; }
.callout { border-radius: 10px; padding: 10px 12px; font-size: 0.88rem; font-weight: 600; background: var(--accent-soft); color: var(--ink); border: 1px solid var(--line); }
.callout.warn { background: var(--fix-soft); color: var(--fix); border-color: currentColor; }
.callout.hot { background: var(--fight-soft); color: var(--fight); border-color: currentColor; }
.error { display: flex; gap: 10px; align-items: flex-start; background: var(--fight-soft); color: var(--fight); border: 1px solid currentColor; border-radius: 10px; padding: 10px 12px; font-weight: 600; }
.error svg { margin-top: 3px; }
.chip { display: inline-flex; align-items: center; font-size: 0.75rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.fix { color: var(--fix); background: var(--fix-soft); border-color: currentColor; }
.chip.hot { color: var(--fight); background: var(--fight-soft); border-color: currentColor; }
.chip.soft { background: var(--ignore-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- loading ---------- */
.loading { text-align: center; padding: 48px 8px; display: grid; gap: 10px; justify-items: center; }
.spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- results ---------- */
.res-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.board { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.board button { display: grid; justify-items: center; align-content: center; gap: 2px; border-radius: 14px; padding: 8px 6px; min-height: 64px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font: inherit; cursor: pointer; }
.board .n { font-size: 1.4rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.board .l { font-size: 0.82rem; font-weight: 700; }
.board button.main { min-height: 88px; }  /* Fix and Fight are the point of the app: bigger */
.board button.main .n { font-size: 2.1rem; }
.board button.main .l { font-size: 0.95rem; }
.board button[data-b="fix"] .n { color: var(--fix); } .board button[data-b="fight"] .n { color: var(--fight); } .board button[data-b="ignore"] .n { color: var(--ignore); } .board button[data-b="keep"] .n { color: var(--keep); }
.board button[aria-selected="true"] { border-width: 2px; color: var(--ink); }
.board button[aria-selected="true"][data-b="fix"] { background: var(--fix-soft); border-color: var(--fix); }
.board button[aria-selected="true"][data-b="fight"] { background: var(--fight-soft); border-color: var(--fight); }
.board button[aria-selected="true"][data-b="ignore"] { background: var(--ignore-soft); border-color: var(--ignore); }
.board button[aria-selected="true"][data-b="keep"] { background: var(--keep-soft); border-color: var(--keep); }
.board button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.panel, .stack { display: grid; gap: 12px; }
.board button .ic { display: none; }
.cand { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; }
.cand input { width: 22px; height: 22px; min-height: 22px; margin: 2px 0 0; padding: 0; accent-color: var(--accent); }
.cand .t { font-size: 0.92rem; overflow-wrap: anywhere; }
.cand .meta { font-size: 0.8rem; color: var(--muted); }
.cmp-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table.cmp { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
table.cmp th, table.cmp td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: center; font-variant-numeric: tabular-nums; }
table.cmp th:first-child { text-align: left; font-weight: 600; min-width: 130px; }
table.cmp thead th { font-size: 0.78rem; color: var(--muted); }
table.cmp tr.sec th { background: var(--ignore-soft); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
table.cmp td.top.bad { color: var(--fight); font-weight: 800; } table.cmp td.top.good { color: var(--keep); font-weight: 800; }
.rule { font-size: 0.9rem; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.panel[data-b="fix"] { --c: var(--fix); } .panel[data-b="fight"] { --c: var(--fight); } .panel[data-b="ignore"] { --c: var(--ignore); } .panel[data-b="keep"] { --c: var(--keep); }
.stars { color: var(--fix); letter-spacing: 1px; white-space: nowrap; }
blockquote { margin: 0; padding: 8px 12px; border-left: 4px solid var(--c); background: var(--quote); border-radius: 0 8px 8px 0; display: grid; gap: 2px; overflow-wrap: anywhere; font-size: 0.95rem; }
blockquote .src { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.full summary { font-size: 0.85rem; min-height: 44px; }
.full p { font-size: 0.88rem; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.why { font-size: 0.92rem; color: var(--muted); }
.draft { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); overflow: hidden; }
.draft-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px 2px 12px; background: var(--ignore-soft); }
.draft-head .lbl { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
.copy { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: var(--accent); font: inherit; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
.copy.done { color: var(--keep); }
.draft .bahasa { padding: 12px; font-size: 0.95rem; overflow-wrap: anywhere; white-space: pre-wrap; user-select: text; -webkit-user-select: text; }
.empty { border: 2px dashed var(--line); border-radius: var(--radius); padding: 20px; color: var(--muted); text-align: center; }
.ignore-list { display: grid; gap: 8px; list-style: none; padding: 0; }
.ignore-list li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 0.92rem; overflow-wrap: anywhere; }
.foot { font-size: 0.8rem; color: var(--muted); }


/* ---------- shared pieces (new) ---------- */
.workspace { display: block; }
.col-2, .dsk { display: none; }
/* phone: the two sections take turns; the bottom bar switches between them */
.workspace[data-section="rivals"] > main { display: none; }
.workspace[data-section="rivals"] > .col-2 { display: grid; gap: 14px; align-content: start; max-width: 480px; margin: 0 auto;
  padding: 16px max(var(--gutter), env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(var(--gutter), env(safe-area-inset-left)); }
@media (max-width: 1099px) { .col-2 .ftile, .col-2 .eyebrow { display: none; } .col-2 .fhead h1 { font-size: 1.3rem; margin: 0; } }
.want { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.85rem; font-weight: 700; color: var(--muted); }
.want .seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 52px; }
.group { display: grid; gap: 10px; }
.group h3 { display: flex; align-items: baseline; gap: 8px; }
.group h3 small { font-weight: 500; color: var(--muted); font-size: 0.85rem; }
.group.learn h3 { color: var(--keep); } .group.avoid h3 { color: var(--fix); } .group.ignore h3 { color: var(--ignore); }
.demo { margin-left: 4px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-head .chips { justify-content: flex-end; }
.lbl-b { font-weight: 800; color: var(--ink); }
.actions { display: grid; gap: 10px; }
.plain { border: 0; background: none; color: var(--accent); font: inherit; font-weight: 700; cursor: pointer; padding: 0 0 0 4px; min-height: 36px; }
.plain.strong { padding: 0; }
.opts summary { font-size: 0.9rem; }
.fallback { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--bg); display: grid; gap: 8px; }
.error strong { display: block; font-size: 1.05rem; margin-bottom: 2px; }
.error > div { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.legend { padding: 0 2px; }
#legend { display: grid; gap: 6px; font-size: 0.9rem; color: var(--muted); padding-bottom: 6px; }
#legend b { margin-right: 6px; }
.stepper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 0; padding: 6px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.stepper li { display: flex; align-items: center; gap: 8px; padding: 4px 10px; font-size: 0.88rem; font-weight: 600; color: var(--muted); min-width: 0; }
.stepper .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line); font-size: 0.78rem; flex: none; }
.stepper li.on { color: var(--ink); } .stepper li.on .dot { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.stepper li.done .dot { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.stepper .dot svg { width: 14px; height: 14px; }
.rcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; }
.rcard h2 { font-size: 1.25rem; }
.ownbox { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; min-width: 0; }
.ownbox small { display: block; color: var(--muted); font-size: 0.78rem; }
.ownbox span { min-width: 0; overflow-wrap: anywhere; }
.btn.pill { border-radius: 999px; background: var(--surface); color: var(--accent); border-color: var(--line); min-height: 40px; padding: 0 16px; font-size: 0.88rem; }
.cand.on { border: 2px solid var(--accent); padding: 11px; }
.cand .chips { margin-top: 4px; }
.cand .chip { color: var(--ink); background: var(--bg); }
.group-lbl { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
.ins { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
.ins .big { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ins .big b { font-size: 2rem; line-height: 1; font-weight: 800; }
.ins .big i { font-style: normal; font-size: 0.8rem; color: var(--muted); }
.ins .bad { color: var(--fight); font-weight: 800; } .ins .good { color: var(--keep); font-weight: 800; }
.dots { display: flex; gap: 3px; justify-content: center; min-height: 8px; margin-bottom: 2px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots.bad i { background: var(--fight); } .dots.good i { background: var(--keep); }
table.cmp td.top { font-weight: 800; }
table.cmp thead th small { display: block; font-weight: 500; font-size: 0.72rem; }
.dnote { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.dnote p { font-size: 0.9rem; overflow-wrap: anywhere; }
.dnote code { display: block; font: 0.78rem var(--font-mono); color: var(--muted); }
.tag { display: inline-block; margin-right: 6px; padding: 0 9px; border-radius: 999px; border: 1px solid currentColor; font-size: 0.72rem; font-weight: 700; }
.tag.small { color: var(--fix); background: var(--fix-soft); } .tag.fail { color: var(--fight); background: var(--fight-soft); } .tag.skip { color: var(--muted); background: var(--ignore-soft); }
.pcard-more summary { font-size: 0.85rem; }
.badge { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-size: 0.72rem; font-weight: 800; display: grid; place-items: center; }
.track { display: grid; gap: 8px; background: var(--keep-soft); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 0.92rem; }
.track .when { font-weight: 800; color: var(--keep); }
.nums { display: grid; gap: 4px; font-variant-numeric: tabular-nums; font-size: 0.92rem; }
.nums .small-warn { font-size: 0.82rem; color: var(--muted); }
.nums .small-warn.strong { color: var(--fix); font-weight: 700; }
.fixform { display: grid; gap: 8px; }
.fixitem { display: grid; gap: 10px; }
.fixitem .note { overflow-wrap: anywhere; }
.btn.danger { color: var(--fight); border-color: currentColor; }
.drafts { display: grid; gap: 12px; }
.ins.bad .big b:first-child { color: var(--fight); } .ins.good .big b:first-child { color: var(--keep); }
.cand .meta { display: block; }
.cmp-title { padding: 14px 10px 4px; }
#legend .lg-fix { color: var(--fix); } #legend .lg-fight { color: var(--fight); } #legend .lg-ignore { color: var(--ignore); } #legend .lg-keep { color: var(--keep); }

@media (min-width: 1100px) {
  :root { --radius: 22px; --bar: #e6eae7; --shadow: 0 1px 2px rgba(23, 32, 28, 0.05), 0 8px 24px rgba(23, 32, 28, 0.04); }
  :root[data-theme="dark"] { --bar: #1a211e; --shadow: none; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bar: #1a211e; --shadow: none; } }
  html, body { height: 100%; }
  body { overflow: hidden; display: flex; flex-direction: column; }
  .topbar { position: static; flex: none; padding: 0 36px; }
  .topbar-in { max-width: none; min-height: 72px; }
  .workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .col { min-width: 0; overflow-y: auto; padding: 28px 36px 56px; }
  main.col { max-width: none; margin: 0; gap: 18px; }
  .col-2 { display: block; border-left: 2px solid var(--line); }
  .workspace[data-section] > main.col { display: grid; }

  const heads = (absent ? [] : [[tr("rivalYou"), d.you.credible]]).concat(d.competitors.map((c, i) => [names[i], c.credible]));
  const body = [];

    body.push(h("tr", { class: "sec" }, h("th", { colspan: heads.length + 1, text: tr(kind === "complaint" ? "rivalComplaints" : "rivalPraise") })));
    rows.forEach((r) => {
      const all = absent ? r.others : [r.you].concat(r.others), top = Math.max(...all);
      body.push(h("tr", {}, h("th", { scope: "row", text: plainTheme(r.theme) }), all.map((n) => {
        const hot = n > 0 && n === top && all.some((x) => x !== n);
        return h("td", { class: hot ? "top " + cls : "" }, h("div", { class: "dots " + (hot ? cls : "") }, Array.from({ length: Math.min(n, 6) }, () => h("i"))), h("span", { text: n + (hot ? " ↑" : "") }));
      })));
    });
  }
  const card = (x) => {
    const theme = plainTheme(x.theme), complaint = x.kind !== "praise_gap";
    const text = x.kind === "worse" ? tr("rivalLineWorse", theme, x.you, x.best) : tr("rivalLineOther", theme, x.you, x.them, nameOf(x.who));
    return h("div", { class: "ins " + (complaint ? "bad" : "good") }, h("div", { class: "big" }, h("b", { text: x.you }), h("i", { text: "vs" }), h("b", { text: x.kind === "worse" ? x.best : x.them })),
      h("p", {}, h("span", { class: complaint ? "bad" : "good", text: tr(complaint ? "rivalComplaints" : "rivalPraise") }), " · " + text));
  };
  const groups = groupInsights(d.insights, d.rows);
  const section = (key, Key, body) => h("div", { class: "group " + key }, h("h3", {}, tr("group" + Key), h("small", { text: tr("group" + Key + "Sub") })), body);
  const none = () => h("p", { class: "small muted", text: tr("groupNone") });

    ],

      h("thead", {}, h("tr", {}, h("th", { scope: "col", text: tr("rivalThemeCol") }), heads.map(([n, c]) => h("th", { scope: "col" }, n, h("small", { text: tr("nReviewsCol", c) })))), ), h("tbody", {}, body))),

function rivalBody() {
  if (rival.step === "searching") return [stepper(1), rivalSpinner(tr("rivalSearching"), tr("rivalSearchSub"))];
  if (rival.step === "comparing") return [stepper(3), rivalSpinner(tr("rivalComparing"), tr("rivalCompareSub"))];
  if (rival.step === "pick") return rivalPick(rival);
  if (rival.step === "result") return rivalResult(rival.data);
  return rivalIdle();
}
function renderRival() {
  rivalBodyEl.replaceChildren(...[rivalBody()].flat(Infinity).filter(Boolean));
}
async function rivalFind(target) {
  const own = ownSource();
  const t = target || (own ? { url: own.url, title: own.title || "", mine: true } : null);
  if (!t) return;
  const run = ++rivalRun;
  track("rivals_started");
  rival = { step: "searching", target: t, want: rivalWant }; renderRival();
  let next;
  try {
    const out = await postJson("/api/competitors/suggest", { url: t.url, title: t.title });
    if (!out || run !== rivalRun) return;
    const cands = out.ok ? out.data.candidates : [];
    next = { step: "pick", target: t, want: rivalWant, candidates: cands, checked: cands.map((c, i) => (c.picked ? i : -1)).filter((i) => i >= 0).slice(0, rivalWant), extra: "", error: out.ok ? "" : errText(out.data, tr("errGeneric", ""), true) };
  } catch (e) {
    if (run !== rivalRun) return;
    next = { step: "pick", target: t, want: rivalWant, candidates: [], checked: [], extra: "", error: tr("errNetwork") };
  }
  rival = next; renderRival();
}
async function rivalCompare() {
  const pick = rival, t = pick.target, chosen = rivalChosen(pick), run = ++rivalRun;
  if (!chosen.length) { pick.error = tr("rivalNeedOne"); renderRival(); return; }
  const own = t.mine && lastData ? lastData.items.map((i) => ({ theme: i.theme, bucket: i.bucket, fake: !!(i.likely_fake && i.likely_fake.flag) })) : [];  // no Bedah ulasan for this link: compare the rivals only
  rival = { step: "comparing", target: t }; renderRival();
  let next;
  try {
    const out = await postJson("/api/competitors/compare", { url: t.url, title: t.title, own, competitors: chosen });
    if (!out || run !== rivalRun) return;
    next = out.ok ? { step: "result", target: t, data: out.data } : Object.assign(pick, { step: "pick", error: errText(out.data, tr("errGeneric", ""), true) });
  } catch (e) {
    if (run !== rivalRun) return;
    next = Object.assign(pick, { step: "pick", error: tr("errNetwork") });
  }
  rival = next; renderRival();
}
$("rivals-open").addEventListener("click", () => openRivals(true));
desktopQuery.addEventListener("change", () => { if (desktop() && currentView === "rivals") show(checkerView); if (lastData) render(lastData, false); else renderRival(); });

/* ---------- views ---------- */
function show(view) {

  $("workspace").dataset.section = view === "rivals" ? "rivals" : "checker";  // on a phone the two sections take turns; a wide screen shows both

}

function tabKeys(listEl, selector, onSelect) {
  listEl.addEventListener("keydown", (e) => {
    const tabs = [...listEl.querySelectorAll(selector)].filter((t) => !t.hidden);
    const i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    let j = null;
    if (e.key === "ArrowRight") j = (i + 1) % tabs.length; else if (e.key === "ArrowLeft") j = (i - 1 + tabs.length) % tabs.length;
    else if (e.key === "Home") j = 0; else if (e.key === "End") j = tabs.length - 1;
    if (j == null) return;
    e.preventDefault(); onSelect(tabs[j]);
  });
}
tabKeys($("tabs"), "button", (t) => { selectTab(t.dataset.b, true); track("tab_viewed", { tab: t.dataset.b }); });

function selectInput(which, focus) {
  for (const t of ["paste", "share", "link"]) {
    const on = t === which;
    $("intab-" + t).setAttribute("aria-selected", on ? "true" : "false"); $("intab-" + t).tabIndex = on ? 0 : -1;
    $("in-" + t).hidden = !on;
    if (on && focus) $("intab-" + t).focus();
  }
  showError("");
}
function setFallback(on) { $("fallback").hidden = !on; $("fb-retry").hidden = !on; }  // shown after a link could not be read: the paste route, with steps
document.querySelectorAll("#intabs button").forEach((b) => b.addEventListener("click", () => { setFallback(false); selectInput(b.dataset.t, false); }));

function showError(msg, title) {
  const e = $("error");
  $("error-title").textContent = title || ""; $("error-title").hidden = !title;
  $("error-text").textContent = msg; e.hidden = !msg;
  if (msg) e.focus();
}

/* ---------- sending ---------- */
let timer = null;
function startLoading(title) {
  const t0 = Date.now();
  $("loading-title").textContent = title; $("loading-sub").textContent = tr("loadingSub"); $("elapsed").textContent = "0s";
  show("loading");
  timer = setInterval(() => { $("elapsed").textContent = Math.round((Date.now() - t0) / 1000) + "s"; }, 1000);
}
function stopLoading() { clearInterval(timer); timer = null; }

async function send(payload, title) {
  showError(""); setFallback(false);
  const buttons = [$("run"), $("fetch")]; buttons.forEach((b) => { b.disabled = true; });
  startLoading(title);
  try {
    const res = await fetch("/api/classify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    let data = null;
    try { data = await res.json(); } catch (e) { /* not JSON */ }
    stopLoading();
    if (res.status === 401) { location.reload(); return; }  // signed out: the server shows the access-code page
    if (!res.ok || !data) {
      show("input");
      const toPaste = data && data.fallback === "paste";
      const unreadable = toPaste && !data.limit;  // a daily limit is not "this link cannot be read"
      if (toPaste) selectInput("paste", false);  // first: switching tabs clears the error box
      if (unreadable) setFallback(true);
      showError(errText(data, tr("errGeneric", res.status)), unreadable ? tr("errFetchTitle") : "");
      return;
    }
    render(data, true);
  } catch (e) {
    stopLoading(); show("input"); showError(tr("errNetwork"));
  } finally {
    buttons.forEach((b) => { b.disabled = false; });
    $("run").textContent = tr("run");
  }
}
function countReviewsRough(text) {
  const blocks = /\n\s*\n/.test(text.trim()) ? text.trim().split(/\n\s*\n/) : text.trim().split("\n");
  return blocks.filter((b) => b.trim()).length;
}
function runPaste() {
  const text = $("paste").value;
  if (!text.trim()) { showError(tr("errPaste")); $("paste").focus(); return; }
  $("shared-note").hidden = true;
  send({ text, product: $("product").value.trim() }, tr("loadingTitle", countReviewsRough(text)));
}
function runFetch() {
  const url = $("url").value.trim();
  if (!url) { showError(tr("errLink")); $("url").focus(); return; }
  send({ url, limit: parseInt($("limit").value, 10) || 10, mode: $("mode").value }, tr("loadingFetch"));
}

/* ---------- Share menu: /?title=...&text=...&url=... ---------- */
function sharedFrom(search) {
  const q = new URLSearchParams(search);
  return [q.get("title"), q.get("text"), q.get("url")].filter(Boolean).join("\n").trim();
}
function takeShared() {
  const shared = sharedFrom(location.search);
  if (!shared) return;
  try { history.replaceState(null, "", location.pathname); } catch (e) { /* keep the query */ }  // do not leave review text in the address bar
  const note = $("shared-note");
  if (/^https?:\/\/\S+$/.test(shared)) {  // only a link arrived, not review text
    note.textContent = tr("sharedLinkOnly"); note.hidden = false;
    if (!$("intab-link").hidden) { $("url").value = shared; selectInput("link", false); }
    return;
  }
  $("paste").value = shared;
  note.textContent = tr("sharedOk"); note.hidden = false;
  selectInput("paste", false);
}
